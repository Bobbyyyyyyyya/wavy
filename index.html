      exportAnalyser.connect(dest);
      exportAnalyser.connect(audioCtx.destination);

      const audioTracks = dest.stream.getAudioTracks();
      if (audioTracks.length > 0) {
        audioTracks.forEach((t) => stream.addTrack(t));
      }

      const duration = state.audioBuffer.duration;
      let frameCount = 0;
      const totalFrames = Math.ceil(duration * 60);

      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const buffer = await blob.arrayBuffer();
        const uint8 = new Uint8Array(buffer);
        let binary = "";
        const chunkSize = 8192;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          binary += String.fromCharCode.apply(
            null,
            uint8.subarray(i, i + chunkSize)
          );
        }
        const base64 = btoa(binary);

        await window.electronAPI.writeFile(base64, savePath);

        overlay.classList.remove("active");
        $("#export-btn").disabled = false;
        audioCtx.close();
      };

      recorder.start();

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(e => console.error("[export] resume failed:", e));
      }
      source.start(0);

      const exportStartTime = performance.now();
      let currentTime = 0;

      function renderFrame() {
        currentTime = (performance.now() - exportStartTime) / 1000;
        if (currentTime > duration + 0.1) {
          recorder.stop();
          source.stop();
          return;
        }

        offCtx.clearRect(0, 0, exportW, exportH);
        paintBackground(offCtx, exportW, exportH);

        const data = state.waveformData;
        if (data) {
          exportAnalyser.getByteFrequencyData(exportFreqData);
          exportAnalyser.getByteTimeDomainData(exportTimeData);
          drawToCtx(offCtx, exportW, exportH, data, currentTime, exportFreqData, exportTimeData);
        }

        frameCount++;
        if (frameCount % 10 === 0) {
          const pct = Math.min(Math.floor((currentTime / duration) * 100), 100);
          $("#export-pct").textContent = pct + "%";
        }

        setTimeout(renderFrame, 0);
      }

      renderFrame();
    });

    function drawToCtx(targetCtx, w, h, data, time, freqData, timeData) {
      const hasLive = freqData && freqData.length > 0;

      switch (state.waveformStyle) {
        case "bars":
          drawBarsCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "wave":
          drawWaveCtx(targetCtx, w, h, data, time, hasLive, timeData);
          break;
        case "mirror":
          drawMirrorCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "circle":
          drawCircleCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "spectrum":
          drawSpectrumCtx(targetCtx, w, h, data, time, hasLive, freqData);
          break;
        case "neon":
          drawNeonCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
        case "particles":
          drawParticlesCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
        case "orbit":
          drawOrbitCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
        case "spiral":
          drawSpiralCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
        case "scope":
          drawScopeCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
        case "flow":
          drawFlowCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
      }
    }

    function drawBarsCtx(c, w, h, data, hasLive, freqData) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const step = Math.max(1, Math.floor(data.length / totalBars));
      const baseY = h * 0.85;
      const binCount = freqData ? freqData.length : 0;
      const useRound = barW > 4;

      for (let i = 0; i < totalBars && i * step < data.length; i++) {
        let val;
        if (hasLive && binCount > 0) {
          val = fftBarValue(freqData, i, totalBars, binCount);
        } else {
          val = data[i * step];
        }
        if (val < 0.02) continue;
        const barH = Math.max(2, val * h * 0.65);
        const x = i * (barW + gap);
        const y = baseY - barH;

        c.fillStyle = state.barColor;
        c.globalAlpha = 0.3 + val * 0.7;
        if (useRound) {
          c.beginPath();
          roundRectCtx(c, x, y, barW, barH, 2);
          c.fill();
        } else {
          c.fillRect(x, y, barW, barH);
        }
      }
      c.globalAlpha = 1;
    }

    function drawWaveCtx(c, w, h, data, time, hasLive, timeData) {
      const baseY = h / 2;
      const step = Math.max(1, Math.floor(w / 960));

      c.beginPath();
      c.strokeStyle = state.barColor + "30";
      c.lineWidth = 2;
      let started = false;
      for (let x = 0; x < w; x += step) {
        let val;
        if (hasLive && timeData && timeData.length > 0) {
          const tIdx = Math.floor((x / w) * timeData.length);
          val = (timeData[tIdx] - 128) / 128;
        } else {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          val = data[idx];
        }
        const y = baseY + val * h * 0.35 * Math.sin(x * 0.05 + time * 3);
        if (!started) { c.moveTo(x, y); started = true; }
        else c.lineTo(x, y);
      }
      c.stroke();

      c.beginPath();
      c.strokeStyle = state.barColor;
      c.lineWidth = 2.5;
      started = false;
      for (let x = 0; x < w; x += step) {
        let val;
        if (hasLive && timeData && timeData.length > 0) {
          const tIdx = Math.floor((x / w) * timeData.length);
          val = (timeData[tIdx] - 128) / 128;
        } else {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          val = data[idx];
        }
        const y = baseY - val * h * 0.35 * Math.sin(x * 0.05 + time * 3);
        if (!started) { c.moveTo(x, y); started = true; }
        else c.lineTo(x, y);
      }
      c.stroke();
    }

    function drawMirrorCtx(c, w, h, data, hasLive, freqData) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const step = Math.max(1, Math.floor(data.length / totalBars));
      const centerY = h / 2;
      const binCount = freqData ? freqData.length : 0;
      const useRound = barW > 4;

      for (let i = 0; i < totalBars && i * step < data.length; i++) {
        let val;
        if (hasLive && binCount > 0) {
          val = fftBarValue(freqData, i, totalBars, binCount);
        } else {
          val = data[i * step];
        }
        if (val < 0.02) continue;
        const barH = Math.max(2, val * h * 0.35);
        const x = i * (barW + gap);

        c.fillStyle = state.barColor;
        if (useRound) {
          c.beginPath();
          roundRectCtx(c, x, centerY - barH, barW, barH, 2);
          c.fill();
          c.fillStyle = state.barColor + "80";
          c.beginPath();
          roundRectCtx(c, x, centerY, barW, barH * 0.7, 2);
          c.fill();
        } else {
          c.fillRect(x, centerY - barH, barW, barH);
          c.fillStyle = state.barColor + "80";
          c.fillRect(x, centerY, barW, barH * 0.7);
        }
      }
    }

    function drawCircleCtx(c, w, h, data, hasLive, freqData) {
      const cx = w / 2;
      const cy = h / 2;
      const baseR = Math.min(w, h) * 0.28;
      const maxAmp = Math.min(w, h) * 0.22;
      const binCount = freqData ? freqData.length : 0;

      c.beginPath();
      c.strokeStyle = state.barColor;
      c.lineWidth = 2;
      const points = 180;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
        let val;
        if (hasLive && binCount > 0) {
          val = fftLogValue(freqData, i, points, binCount);
        } else {
          const dataIdx = Math.floor((i / points) * data.length);
          val = data[dataIdx] || 0;
        }
        const r = baseR + val * maxAmp;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.stroke();
    }

    function drawSpectrumCtx(c, w, h, data, time, hasLive, freqData) {
      const bands = 64;
      const bandW = w / bands;
      let fftData;
      if (hasLive && freqData && freqData.length > 0) {
        fftData = freqData;
      } else {
        fftData = state.audioBuffer
          ? extractFFTData(state.audioBuffer, time % state.audioBuffer.duration)
          : data;
      }

      for (let i = 0; i < bands; i++) {
        const idx = Math.floor((i / bands) * fftData.length);
        let val;
        if (hasLive) {
          val = fftData[idx] / 255;
        } else {
          val = fftData[idx] || 0;
        }
        const barH = Math.max(2, val * h * 0.85);
        const x = i * bandW;
        const hue = (i / bands) * 300;

        c.fillStyle = `hsla(${hue}, 80%, 60%, 0.9)`;

        c.beginPath();
        roundRectCtx(c, x + 1, h - barH, bandW - 2, barH, 2);
        c.fill();
      }
    }

    function roundRectCtx(c, x, y, w, h, r) {
      if (h < 0) {
        y += h;
        h = Math.abs(h);
      }
      r = Math.min(r, h / 2, w / 2);
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    // Preview canvases
    function drawPreviewBars() {
      const c = document.getElementById("preview-bars").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const bars = [0.4, 0.7, 1, 0.6, 0.9, 0.5, 0.8, 0.3, 0.7, 0.5, 0.9, 0.6, 0.45, 0.75];
      const barW = 3;
      const gap = (w - bars.length * barW) / (bars.length - 1);
      bars.forEach((v, i) => {
        c.fillStyle = "#7c5cfc";
        c.fillRect(i * (barW + gap), h - v * h, barW, v * h);
      });
    }

    function drawPreviewWave() {
      const c = document.getElementById("preview-wave").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 2;
      c.beginPath();
      for (let x = 0; x < w; x++) {
        const y = h / 2 + Math.sin(x * 0.3) * 12;
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
      c.strokeStyle = "#7c5cfc30";
      c.lineWidth = 1.5;
      c.beginPath();
      for (let x = 0; x < w; x++) {
        const y = h / 2 - Math.sin(x * 0.3) * 12;
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
    }

    function drawPreviewMirror() {
      const c = document.getElementById("preview-mirror").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const vals = [0.4, 0.8, 1, 0.6, 0.9, 0.5, 0.8, 0.4, 0.7, 0.65];
      const barW = 4;
      const gap = (w - vals.length * barW) / (vals.length - 1);
      vals.forEach((v, i) => {
        c.fillStyle = "#7c5cfc";
        c.fillRect(i * (barW + gap), h / 2 - v * 14, barW, v * 14);
        c.fillStyle = "#7c5cfc60";
        c.fillRect(i * (barW + gap), h / 2, barW, v * 10);
      });
    }

    function drawPreviewCircle() {
      const c = document.getElementById("preview-circle").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.strokeStyle = "#7c5cfc20";
      c.lineWidth = 1;
      c.beginPath();
      c.arc(w / 2, h / 2, 10, 0, Math.PI * 2);
      c.stroke();
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 2;
      c.beginPath();
      for (let i = 0; i <= 60; i++) {
        const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
        const val = 0.5 + 0.5 * Math.sin(i * 0.5);
        const r = 10 + val * 6;
        const x = w / 2 + Math.cos(angle) * r;
        const y = h / 2 + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.stroke();
    }

    function drawPreviewSpectrum() {
      const c = document.getElementById("preview-spectrum").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const vals = [0.5, 0.8, 1, 0.7, 0.9, 0.6, 0.8, 1, 0.7, 0.5, 0.9, 0.4, 0.75, 0.65];
      const barW = 3;
      const gap = (w - vals.length * barW) / (vals.length - 1);
      vals.forEach((v, i) => {
        const hue = (i / vals.length) * 300;
        c.fillStyle = `hsla(${hue}, 80%, 60%, 0.9)`;
        c.fillRect(i * (barW + gap), h - v * h, barW, v * h);
      });
    }

    function drawPreviewNeon() {
      const el = document.getElementById("preview-neon");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#030309";
      c.fillRect(0, 0, w, h);
      c.fillStyle = "#ffffff";
      for (let i = 0; i < 22; i++) {
        c.globalAlpha = 0.25 + seededRand(i + 50) * 0.6;
        c.beginPath();
        c.arc(seededRand(i * 2 + 1) * w, seededRand(i * 2 + 2) * h * 0.72, 0.6, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
      const wave = (layer, color, width, phase, depth) => {
        const draw = (col, wd, alpha, blur, core) => {
          c.save();
          c.globalAlpha = alpha;
          c.strokeStyle = col;
          c.lineWidth = wd;
          c.shadowColor = color;
          c.shadowBlur = blur;
          c.beginPath();
          for (let x = 0; x <= w; x += 1) {
            const nx = x / w;
            const env = Math.pow(Math.sin(Math.PI * nx), 1.4);
            const carrier = Math.sin((nx - 0.12) * 10.5 + phase) * 0.52 + Math.sin((nx - 0.38) * 19.0 - phase * 1.3 + layer) * 0.3;
            const g = (cc, s) => Math.exp(-Math.pow((nx - cc) / s, 2));
            const shape = carrier * 0.75 + g(0.44, 0.085) * 1.0 - g(0.60, 0.065) * depth - g(0.74, 0.075) * 0.85;
            const y = h * 0.47 + shape * 9 * (0.08 + 0.92 * env);
            if (x === 0) c.moveTo(x, y);
            else c.lineTo(x, y);
          }
          c.stroke();
          c.restore();
        };
        draw(color, width * 2.6, 0.30, 5, false);
        draw(color, width * 1.3, 0.95, 4, false);
        draw("rgba(255,255,255,0.9)", Math.max(0.7, width * 0.45), 0.85, 0, true);
      };
      wave(0, "#ff5fd2", 1.3, 0.5, 0.8);
      wave(1, "#22e6ff", 1.4, 1.8, 1.5);
      wave(2, "#ff8de0", 0.8, 3.0, 0.8);
      // vloerlijntje
      c.save();
      c.globalAlpha = 0.35;
      c.strokeStyle = "#96e6ff";
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, h * 0.70);
      c.lineTo(w, h * 0.70);
      c.stroke();
      c.restore();
    }

    function drawPreviewParticles() {
      const el = document.getElementById("preview-particles");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#0a0a0f";
      c.fillRect(0, 0, w, h);
      for (let i = 0; i < 40; i++) {
        const v = seededRand(i * 3 + 12);
        c.globalAlpha = 0.3 + v * 0.7;
        c.fillStyle = i % 3 === 2 ? "#22e6ff" : "#7c5cfc";
        c.beginPath();
        c.arc(seededRand(i * 3 + 11) * w, h * 0.9 - seededRand(i * 3 + 13) * h * 0.7 - v * 8, 0.8 + v * 2.4, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
    }

    function drawPreviewSpiral() {
      const el = document.getElementById("preview-spiral");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#0a0a0f";
      c.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2;
      for (const [off, col] of [[0, "#7c5cfc"], [Math.PI, "#22e6ff"]]) {
        c.save();
        c.strokeStyle = col;
        c.lineWidth = 1.4;
        c.shadowColor = col;
        c.shadowBlur = 4;
        c.beginPath();
        for (let i = 0; i <= 90; i++) {
          const f = i / 90;
          const a = off + f * Math.PI * 6;
          const v = 0.5 + 0.5 * Math.sin(i * 0.4);
          const r = 16 * f * (0.6 + v * 0.7);
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r * 0.62;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.stroke();
        c.restore();
      }
    }

    function drawPreviewScope() {
      const el = document.getElementById("preview-scope");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#061206";
      c.fillRect(0, 0, w, h);
      c.strokeStyle = "rgba(255,255,255,0.12)";
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, h / 2); c.lineTo(w, h / 2);
      c.moveTo(w / 2, 0); c.lineTo(w / 2, h);
      c.stroke();
      c.save();
      c.strokeStyle = "#5cfc9c";
      c.lineWidth = 1.6;
      c.shadowColor = "#5cfc9c";
      c.shadowBlur = 5;
      c.beginPath();
      for (let x = 0; x <= w; x++) {
        const y = h / 2 + Math.sin(x * 0.35) * 8 * Math.sin(Math.PI * x / w) + Math.sin(x * 0.9) * 3;
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
      c.restore();
    }

    function drawPreviewFlow() {
      const el = document.getElementById("preview-flow");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#0a0a0f";
      c.fillRect(0, 0, w, h);
      const g = c.createLinearGradient(0, 6, 0, h - 6);
      g.addColorStop(0, "rgba(124,92,252,0.05)");
      g.addColorStop(0.5, "rgba(124,92,252,0.7)");
      g.addColorStop(1, "rgba(124,92,252,0.05)");
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(0, h / 2);
      for (let x = 0; x <= w; x++) {
        c.lineTo(x, h / 2 + Math.sin(x * 0.25) * 10 * Math.sin(Math.PI * x / w));
      }
      c.lineTo(w, h / 2);
      c.closePath();
      c.fill();
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 1.6;
      c.shadowColor = "#7c5cfc";
      c.shadowBlur = 4;
      c.beginPath();
      for (let x = 0; x <= w; x++) {
        const y = h / 2 + Math.sin(x * 0.25) * 10 * Math.sin(Math.PI * x / w);
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
    }

    function drawPreviewOrbit() {
      const el = document.getElementById("preview-orbit");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#0a0a0f";
      c.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, baseR = 9;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2;
        const v = 0.3 + 0.7 * Math.abs(Math.sin(i * 0.7));
        const len = 2 + v * 9;
        c.save();
        c.globalAlpha = 0.4 + v * 0.6;
        c.strokeStyle = i % 4 === 3 ? "#22e6ff" : "#7c5cfc";
        c.lineWidth = 1.6;
        c.lineCap = "round";
        c.shadowColor = c.strokeStyle;
        c.shadowBlur = 3;
        c.beginPath();
        c.moveTo(cx + Math.cos(a) * baseR, cy + Math.sin(a) * baseR);
        c.lineTo(cx + Math.cos(a) * (baseR + len), cy + Math.sin(a) * (baseR + len));
        c.stroke();
        c.restore();
      }
      c.save();
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 1.6;
      c.shadowColor = "#7c5cfc";
      c.shadowBlur = 5;
      c.beginPath();
      c.arc(cx, cy, baseR, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = "#fff";
      c.beginPath();
      c.arc(cx, cy, 2, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    drawPreviewBars();
    drawPreviewWave();
    drawPreviewMirror();
    drawPreviewCircle();
    drawPreviewOrbit();
    drawPreviewSpectrum();
    drawPreviewNeon();
    drawPreviewParticles();
    drawPreviewSpiral();
    drawPreviewScope();
    drawPreviewFlow();
    loadSettings();
    drawIdle();
  </script>
</body>
