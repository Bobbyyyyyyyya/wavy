<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface-hover: #1a1a24;
      --border: #2a2a35;
      --text: #e8e8ef;
      --text-dim: #7a7a8a;
      --accent: #7c5cfc;
      --accent-hover: #9478ff;
      --danger: #fc5c7c;
      --success: #5cfc9c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    button, input, select, .color-swatch, .waveform-option, a {
      -webkit-app-region: no-drag;
    }

    .titlebar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      -webkit-app-region: drag;
      position: relative;
    }

    .titlebar h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-left: 60px;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 52px);
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-app-region: no-drag;
      will-change: scroll-position;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar::-webkit-scrollbar {
      width: 10px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
      border: 2px solid var(--surface);
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    .sidebar h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .file-drop:hover,
    .file-drop.dragover {
      border-color: var(--accent);
      background: rgba(124, 92, 252, 0.05);
    }

    .file-drop .icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    .file-drop p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .file-drop .filename {
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      word-break: break-all;
    }

    .waveform-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .waveform-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .waveform-option:hover {
      background: var(--surface-hover);
    }

    .waveform-option.selected {
      border-color: var(--accent);
      background: rgba(124, 92, 252, 0.08);
    }

    .waveform-option .preview {
      width: 64px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
      display: block;
      image-rendering: crisp-edges;
    }

    .waveform-option .preview-wrap {
      width: 64px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
      overflow: hidden;
    }

    .waveform-option .preview-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .waveform-option .label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .waveform-option .desc {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-row label {
      font-size: 13px;
      color: var(--text-dim);
    }

    .control-row .value {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      min-width: 40px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      margin-top: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
    }

    .color-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      width: 100%;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .export-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      margin-top: auto;
      letter-spacing: 0.3px;
    }

    .export-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .export-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      -webkit-app-region: no-drag;
    }

    .canvas-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #waveform-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }

    .play-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .time-display {
      font-size: 13px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", monospace;
    }

    .progress-bar {
      flex: 1;
      max-width: 400px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.05s linear;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
    }

    .empty-state .icon {
      font-size: 64px;
      opacity: 0.15;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 13px;
      opacity: 0.5;
    }

    .progress-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
      z-index: 10;
      display: none;
    }

    .progress-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-overlay p {
      font-size: 14px;
      color: var(--text-dim);
    }

    .progress-overlay .pct {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>Wavy</h1>
  </div>

  <div class="app">
    <div class="sidebar">
      <div class="control-group">
        <h2>Audio Source</h2>
        <div class="file-drop" id="file-drop">
          <div class="icon">🎵</div>
          <p id="file-drop-text">Click or drop an audio file here<br /><span style="font-size:11px; opacity:0.5">MP3, WAV, OGG, FLAC, AAC</span></p>
        </div>
      </div>

      <div class="control-group">
        <h2>Waveform Style</h2>
        <div class="waveform-options" id="waveform-options">
          <button class="waveform-option selected" data-style="bars">
            <div class="preview-wrap"><canvas class="preview" id="preview-bars" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Bars</div>
              <div class="desc">Classic vertical bars</div>
            </div>
          </button>
          <button class="waveform-option" data-style="wave">
            <div class="preview-wrap"><canvas class="preview" id="preview-wave" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Wave</div>
              <div class="desc">Smooth continuous line</div>
            </div>
          </button>
          <button class="waveform-option" data-style="mirror">
            <div class="preview-wrap"><canvas class="preview" id="preview-mirror" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Mirror</div>
              <div class="desc">Symmetric bars, top & bottom</div>
            </div>
          </button>
          <button class="waveform-option" data-style="circle">
            <div class="preview-wrap"><canvas class="preview" id="preview-circle" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Circle</div>
              <div class="desc">Radial pulsing ring</div>
            </div>
          </button>
          <button class="waveform-option" data-style="spectrum">
            <div class="preview-wrap"><canvas class="preview" id="preview-spectrum" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Spectrum</div>
              <div class="desc">FFT frequency bands</div>
            </div>
          </button>
          <button class="waveform-option" data-style="neon">
            <div class="preview-wrap"><canvas class="preview" id="preview-neon" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Neon Flow</div>
              <div class="desc">Glowing dual wave + stars</div>
            </div>
          </button>
        </div>
      </div>

      <div class="control-group">
        <h2>Resolution</h2>
        <select id="resolution">
          <option value="720">720p (1280×720)</option>
          <option value="1080" selected>1080p (1920×1080)</option>
          <option value="1440">1440p (2560×1440)</option>
          <option value="2160">4K (3840×2160)</option>
        </select>
      </div>

      <div class="control-group">
        <h2>Format</h2>
        <select id="export-format">
          <option value="webm" selected>WebM (VP9)</option>
          <option value="webm-vp8">WebM (VP8)</option>
          <option value="mp4">MP4 (H.264)</option>
        </select>
      </div>

      <div class="control-group">
        <h2>Background</h2>
        <select id="bg-mode">
          <option value="solid" selected>Solid Color</option>
          <option value="gradient">Gradient</option>
          <option value="image">Image</option>
        </select>
        <div class="color-row" id="bg-colors">
          <div class="color-swatch selected" style="background:#0a0a0f" data-color="#0a0a0f"></div>
          <div class="color-swatch" style="background:#1a1a2e" data-color="#1a1a2e"></div>
          <div class="color-swatch" style="background:#0f0f0f" data-color="#0f0f0f"></div>
          <div class="color-swatch" style="background:#0d1117" data-color="#0d1117"></div>
          <div class="color-swatch" style="background:#1a0a2e" data-color="#1a0a2e"></div>
          <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
        </div>
      </div>

      <div class="control-group">
        <h2>Bar Color</h2>
        <div class="color-row" id="bar-colors">
          <div class="color-swatch selected" style="background:#7c5cfc" data-color="#7c5cfc"></div>
          <div class="color-swatch" style="background:#00d4ff" data-color="#00d4ff"></div>
          <div class="color-swatch" style="background:#ff6b6b" data-color="#ff6b6b"></div>
          <div class="color-swatch" style="background:#5cfc9c" data-color="#5cfc9c"></div>
          <div class="color-swatch" style="background:#ffc53d" data-color="#ffc53d"></div>
          <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
        </div>
      </div>

      <div class="control-group">
        <h2>Bar Width <span class="value" id="bar-width-val">4</span></h2>
        <input type="range" id="bar-width" min="2" max="12" value="4" />
      </div>

      <div class="control-group">
        <h2>Bar Gap <span class="value" id="bar-gap-val">2</span></h2>
        <input type="range" id="bar-gap" min="1" max="8" value="2" />
      </div>

      <div class="control-group">
        <h2>Smoothing <span class="value" id="smoothing-val">0.8</span></h2>
        <input type="range" id="smoothing" min="0" max="99" value="80" />
      </div>

      <button class="export-btn" id="export-btn" disabled>Export Video</button>
    </div>

    <div class="main-area">
      <div class="canvas-container" id="canvas-container">
        <canvas id="waveform-canvas"></canvas>
        <div class="progress-overlay" id="progress-overlay">
          <div class="spinner"></div>
          <div class="pct" id="export-pct">0%</div>
          <p>Rendering waveform video...</p>
        </div>
      </div>

      <div class="playback-controls" id="playback-controls" style="display:none">
        <button class="play-btn" id="play-btn">▶</button>
        <span class="time-display" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time-display" id="time-total">0:00</span>
      </div>

      <div class="empty-state" id="empty-state">
        <div class="icon">〰️</div>
        <h3>No audio loaded</h3>
        <p>Drop a file to see the waveform preview</p>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      const m = msg + " at " + src + ":" + line + ":" + col;
      console.error(m);
      try { window.electronAPI.logError(m); } catch(e) {}
    };
    window.addEventListener("unhandledrejection", function(e) {
      console.error("Unhandled promise:", e.reason);
      try { window.electronAPI.logError("Promise: " + e.reason); } catch(x) {}
    });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const state = {
      audioBuffer: null,
      audioContext: null,
      sourceNode: null,
      analyserNode: null,
      freqData: null,
      timeData: null,
      isPlaying: false,
      startTime: 0,
      pauseTime: 0,
      waveformStyle: "bars",
      bgColor: "#0a0a0f",
      barColor: "#7c5cfc",
      barWidth: 4,
      barGap: 2,
      smoothing: 0.8,
      resolution: 1080,
      exportFormat: "webm",
      bgMode: "solid",
      waveformData: null,
      animFrame: null,
    };

    const canvas = $("#waveform-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = $("#canvas-container");
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      drawIdle();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawIdle() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = state.bgColor;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = state.barColor + "30";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    // File handling
    const dropZone = $("#file-drop");

    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => e.preventDefault());

    dropZone.addEventListener("click", async () => {
      const file = await window.electronAPI.openAudioFile();
      if (file) loadAudioFile(file);
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        try {
          const filePath = window.electronAPI.getFilePath(files[0]);
          const file = await window.electronAPI.readAudioFile(filePath);
          if (file) loadAudioFile(file);
        } catch (err) {
          console.error("Failed to read dropped file:", err);
          alert("Could not read file: " + err.message);
        }
      }
    });

    async function loadAudioFileRaw(fileName, arrayBuffer) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        state.audioBuffer = audioBuffer;
        state.audioContext = audioCtx;
        state.pauseTime = 0;
        state.waveformData = extractWaveformData(audioBuffer);

        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = state.smoothing;
        state.analyserNode = analyser;
        state.freqData = new Uint8Array(analyser.frequencyBinCount);
        state.timeData = new Uint8Array(analyser.frequencyBinCount);

        $("#file-drop-text").innerHTML = `<div class="filename">${fileName}</div>`;
        $("#export-btn").disabled = false;
        $("#playback-controls").style.display = "flex";
        $("#empty-state").style.display = "none";

        const dur = audioBuffer.duration;
        $("#time-total").textContent = formatTime(dur);
        $("#time-current").textContent = "0:00";

        drawPreviewFrame();
      } catch (err) {
        console.error("Failed to load audio:", err);
        alert("Could not load audio file: " + err.message);
      }
    }

    async function loadAudioFile(file) {
      const bytes = atob(file.buffer);
      const raw = new ArrayBuffer(bytes.length);
      const view = new Uint8Array(raw);
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const slice = bytes.slice(i, i + chunkSize);
        for (let j = 0; j < slice.length; j++) {
          view[i + j] = slice.charCodeAt(j);
        }
      }
      await loadAudioFileRaw(file.fileName, raw);
    }

    function extractWaveformData(audioBuffer) {
      const channelData = audioBuffer.getChannelData(0);
      const samples = 512;
      const blockSize = Math.floor(channelData.length / samples);
      const data = [];

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        const start = i * blockSize;
        for (let j = 0; j < blockSize; j++) {
          sum += Math.abs(channelData[start + j] || 0);
        }
        data.push(sum / blockSize);
      }

      const max = Math.max(...data, 0.001);
      return data.map((v) => v / max);
    }

    function extractFFTData(audioBuffer, timeIndex) {
      const sampleRate = audioBuffer.sampleRate;
      const channelData = audioBuffer.getChannelData(0);
      const fftSize = 256;
      const start = Math.floor(timeIndex * sampleRate);
      const slice = channelData.slice(start, start + fftSize);

      const data = [];
      for (let i = 0; i < slice.length / 2; i++) {
        let sum = 0;
        for (let j = 0; j < 2; j++) {
          const idx = i * 2 + j;
          if (idx < slice.length) sum += Math.abs(slice[idx]);
        }
        data.push(sum / 2);
      }

      const max = Math.max(...data, 0.001);
      return data.map((v) => v / max);
    }

    // Waveform drawing
    function drawWaveformStyle(w, h, time) {
      ctx.clearRect(0, 0, w, h);

      if (state.bgMode === "gradient") {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, state.bgColor);
        grad.addColorStop(1, shiftColor(state.bgColor, 30));
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = state.bgColor;
      }
      ctx.fillRect(0, 0, w, h);

      const data = state.waveformData;
      if (!data) return;

      const progress = state.audioBuffer
        ? time / state.audioBuffer.duration
        : 0;
      const playedSamples = Math.floor(progress * data.length);
      const live = state.isPlaying && state.freqData;

      switch (state.waveformStyle) {
        case "bars":
          drawBars(w, h, data, playedSamples, live);
          break;
        case "wave":
          drawWave(w, h, data, playedSamples, live);
          break;
        case "mirror":
          drawMirror(w, h, data, playedSamples, live);
          break;
        case "circle":
          drawCircle(w, h, data, playedSamples, live);
          break;
        case "spectrum":
          drawSpectrum(w, h, data, time, playedSamples, live);
          break;
        case "neon":
          drawNeon(w, h, data, time, playedSamples, live);
          break;
      }
    }

    function fftBarValue(fft, bar, totalBars, binCount) {
      const startIdx = Math.floor((bar / totalBars) * binCount);
      const endIdx = Math.max(startIdx + 1, Math.floor(((bar + 1) / totalBars) * binCount));
      let sum = 0;
      let count = 0;
      for (let i = startIdx; i < endIdx && i < binCount; i++) {
        sum += fft[i];
        count++;
      }
      return count > 0 ? sum / count / 255 : 0;
    }

    function fftLogValue(fft, point, totalPoints, binCount) {
      const usableBins = Math.floor(binCount * 0.8);
      const t = point / totalPoints;
      const startIdx = Math.min(Math.floor(Math.pow(t, 1.2) * usableBins), usableBins - 1);
      const tNext = (point + 1) / totalPoints;
      const endIdx = Math.min(Math.max(startIdx + 1, Math.floor(Math.pow(tNext, 1.2) * usableBins)), usableBins);
      let sum = 0;
      let count = 0;
      for (let i = startIdx; i < endIdx; i++) {
        const boost = 1 + (i / usableBins) * 1.5;
        sum += Math.min(255, fft[i] * boost);
        count++;
      }
      return count > 0 ? sum / count / 255 : 0;
    }

    function drawBars(w, h, data, played, live) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const baseY = h * 0.85;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < totalBars; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, totalBars, binCount);
        } else {
          const step = Math.max(1, Math.floor(data.length / totalBars));
          val = (i * step < data.length) ? data[i * step] : 0;
        }
        const barH = Math.max(2, val * h * 0.65);
        const x = i * (barW + gap);

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.3 + val * 0.7;
        ctx.beginPath();
        roundRect(ctx, x, baseY - barH, barW, barH, barW > 4 ? 2 : 1);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawWave(w, h, data, played, live) {
      const baseY = h / 2;
      const fft = state.freqData;
      const time = state.timeData;
      const binCount = fft ? fft.length : 0;

      // Background line
      ctx.beginPath();
      ctx.strokeStyle = state.barColor + "30";
      ctx.lineWidth = 2;
      for (let x = 0; x < w; x++) {
        const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
        const val = data[idx] * h * 0.35;
        const y = baseY + val * Math.sin(x * 0.05 + Date.now() * 0.002);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Live waveform from time domain data
      ctx.beginPath();
      ctx.strokeStyle = state.barColor;
      ctx.lineWidth = 2.5;
      if (live && time) {
        const sliceWidth = w / time.length;
        for (let i = 0; i < time.length; i++) {
          const v = (time[i] - 128) / 128;
          const y = baseY + v * h * 0.4;
          const x = i * sliceWidth;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      } else {
        for (let x = 0; x < w; x++) {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          const val = data[idx] * h * 0.35;
          const y = baseY - val * Math.sin(x * 0.05 + Date.now() * 0.002);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      if (played > 0) {
        const px = (played / data.length) * w;
        ctx.fillStyle = state.barColor + "10";
        ctx.fillRect(0, 0, px, h);
      }
    }

    function drawMirror(w, h, data, played, live) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const centerY = h / 2;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < totalBars; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, totalBars, binCount);
        } else {
          const step = Math.max(1, Math.floor(data.length / totalBars));
          val = (i * step < data.length) ? data[i * step] : 0;
        }
        const barH = Math.max(2, val * h * 0.35);
        const x = i * (barW + gap);

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.3 + val * 0.7;
        ctx.beginPath();
        roundRect(ctx, x, centerY - barH, barW, barH, barW > 4 ? 2 : 1);
        ctx.fill();

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.2 + val * 0.5;
        ctx.beginPath();
        roundRect(ctx, x, centerY, barW, barH * 0.7, barW > 4 ? 2 : 1);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawCircle(w, h, data, played, live) {
      const cx = w / 2;
      const cy = h / 2;
      const baseR = Math.min(w, h) * 0.28;
      const maxAmp = Math.min(w, h) * 0.22;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      ctx.fillStyle = state.barColor + "06";
      ctx.beginPath();
      ctx.arc(cx, cy, baseR + maxAmp * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = state.barColor;
      ctx.lineWidth = 2;
      const points = 180;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
        let val;
        if (live && binCount > 0) {
          val = fftLogValue(fft, i, points, binCount);
        } else {
          const dataIdx = Math.floor((i / points) * data.length);
          val = data[dataIdx] || 0;
        }
        const r = baseR + val * maxAmp;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = state.barColor + "15";
      ctx.lineWidth = 1;
      ctx.arc(cx, cy, baseR * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawSpectrum(w, h, data, time, played, live) {
      const bands = 64;
      const bandW = w / bands;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < bands; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, bands, binCount);
        } else {
          const fftData = state.audioBuffer
            ? extractFFTData(state.audioBuffer, time % state.audioBuffer.duration)
            : data;
          const idx = Math.floor((i / bands) * fftData.length);
          val = fftData[idx] || 0;
        }
        const barH = Math.max(2, val * h * 0.85);
        const x = i * bandW;
        const hue = (i / bands) * 300;

        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.15 + val * 0.85})`;
        ctx.beginPath();
        roundRect(ctx, x + 1, h - barH, bandW - 2, barH, 2);
        ctx.fill();
      }
    }

    function drawNeon(w, h, data, time, played, live) {
      drawNeonWaves(ctx, w, h, data, time, live ? state.freqData : null, live ? state.timeData : null);
    }

    function seededRand(n) {
      const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    }

    function getNeonColors() {
      const c1 = state.barColor || "#ff5fd2";
      let c2 = "#22e6ff";
      try {
        const lower = c1.toLowerCase();
        // Als primary al cyaan-achtig is, maak secondary roze en omgekeerd
        const isCyan = lower.includes("00d4") || lower.includes("22e6") || lower.includes("5cfc") || lower === "#00ffff" || lower === "#22e6ff";
        const isPink = lower.includes("ff6") || lower.includes("fc5c") || lower.includes("ff5f") || lower.includes("ff2d");
        if (isCyan) c2 = "#ff5fd2";
        else if (isPink) c2 = "#22e6ff";
        else c2 = shiftHueHex(c1, 170);
      } catch (e) { c2 = "#22e6ff"; }
      return [c1, c2];
    }

    function shiftHueHex(hex, deg) {
      let h = hex.replace("#", "");
      if (h.length === 3) h = h.split("").map((c) => c + c).join("");
      const r = parseInt(h.substring(0, 2), 16) / 255;
      const g = parseInt(h.substring(2, 4), 16) / 255;
      const b = parseInt(h.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let hh = 0, ss = 0, ll = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        ss = ll > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: hh = (g - b) / d + (g < b ? 6 : 0); break;
          case g: hh = (b - r) / d + 2; break;
          default: hh = (r - g) / d + 4; break;
        }
        hh *= 60;
      }
      hh = (hh + deg) % 360;
      if (hh < 0) hh += 360;
      return `hsl(${Math.round(hh)}, 100%, 65%)`;
    }

    function neonEnergy(freqData) {
      if (!freqData || freqData.length === 0) return 0.55;
      let sum = 0;
      const n = Math.min(freqData.length, 200);
      for (let i = 0; i < n; i++) sum += freqData[i];
      return Math.min(1, (sum / n / 255) * 1.6);
    }

    function neonY(x, w, h, data, energy, t, layer) {
      const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
      const base = data[idx] || 0;
      const nx = x / w;
      const env = 0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, Math.max(0, nx)));
      const amp = h * 0.22 * (0.3 + energy * 1.1) * env;
      const wob1 = Math.sin(x * 0.008 + t * 2.0 + layer * 1.7);
      const wob2 = Math.sin(x * 0.021 - t * 3.1 + layer * 0.9);
      const wob3 = Math.sin(x * 0.045 + t * 5.2 + layer * 2.3) * 0.3;
      return h * 0.46 + (base - 0.35) * amp * 1.9 + (wob1 * 0.55 + wob2 * 0.3 + wob3 * 0.15) * amp;
    }

    function drawNeonStars(c, w, h, t, alphaMul) {
      const count = Math.floor((w * h) / 9000);
      c.save();
      for (let i = 0; i < count; i++) {
        const sx = seededRand(i * 2 + 1) * w;
        const sy = seededRand(i * 2 + 2) * h * 0.9;
        const rr = 0.5 + seededRand(i * 3 + 4) * (w > 1000 ? 2.2 : 1.3);
        const tw = 0.25 + 0.75 * Math.abs(Math.sin(t * (0.6 + seededRand(i + 9)) + i));
        c.globalAlpha = tw * 0.8 * (alphaMul || 1);
        c.fillStyle = "#ffffff";
        c.beginPath();
        c.arc(sx, sy, rr, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    function strokeNeonPath(c, w, h, data, energy, t, color, width, glow, layer, alpha) {
      const step = Math.max(1, Math.floor(w / 960));
      c.save();
      c.globalAlpha = alpha == null ? 1 : alpha;
      c.strokeStyle = color;
      c.lineWidth = width;
      c.lineJoin = "round";
      c.lineCap = "round";
      c.shadowColor = color;
      c.shadowBlur = glow;
      c.beginPath();
      let started = false;
      for (let x = 0; x <= w; x += step) {
        const y = neonY(x, w, h, data, energy, t, layer);
        if (!started) { c.moveTo(x, y); started = true; }
        else c.lineTo(x, y);
      }
      c.stroke();
      c.restore();
    }

    function drawNeonWaves(c, w, h, data, time, freqData, timeData) {
      const t = time + performance.now() / 1000 * 0.15;
      const energy = freqData ? neonEnergy(freqData) : 0.55;
      const [col1, col2] = getNeonColors();
      const scale = Math.max(0.6, w / 1280);
      const lw = Math.max(1.5, 3 * scale * 0.55 + state.barWidth * 0.35);
      const glow = Math.min(45, 18 * scale + 8);

      // Vignette achtergrond voor diepte zoals screenshot
      const bgGrad = c.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.1, w / 2, h * 0.5, Math.max(w, h) * 0.75);
      bgGrad.addColorStop(0, state.bgColor);
      bgGrad.addColorStop(1, "#000000");
      c.fillStyle = bgGrad;
      c.fillRect(0, 0, w, h);

      drawNeonStars(c, w, h, t, 1);

      // Subtiele middenlijn
      c.save();
      c.globalAlpha = 0.14;
      c.strokeStyle = "#ffffff";
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, h * 0.46);
      c.lineTo(w, h * 0.46);
      c.stroke();
      c.restore();

      // Zachte fill onder de cyaan golf (zoals in screenshot)
      c.save();
      c.globalAlpha = 0.16;
      c.fillStyle = col2;
      c.shadowColor = col2;
      c.shadowBlur = glow;
      const step = Math.max(1, Math.floor(w / 480));
      c.beginPath();
      c.moveTo(0, h * 0.46);
      for (let x = 0; x <= w; x += step) c.lineTo(x, neonY(x, w, h, data, energy, t, 1));
      c.lineTo(w, h * 0.46);
      c.closePath();
      c.fill();
      c.restore();

      // 3 lagen: roze achter, cyaan voor, roze highlight
      strokeNeonPath(c, w, h, data, energy, t, col1, lw, glow, 0, 0.85);
      strokeNeonPath(c, w, h, data, energy, t, col2, lw * 1.05, glow * 1.2, 1, 1);
      strokeNeonPath(c, w, h, data, energy, t, col1, lw * 0.55, glow * 0.7, 2, 0.9);

      // Reflectie onderaan zoals screenshot
      c.save();
      c.globalAlpha = 0.16;
      try { c.filter = `blur(${Math.max(1, 2 * scale)}px)`; } catch (e) {}
      c.translate(0, h * 1.52);
      c.scale(1, -0.55);
      const step2 = Math.max(2, Math.floor(w / 480));
      c.strokeStyle = col2;
      c.lineWidth = lw;
      c.shadowColor = col2;
      c.shadowBlur = glow;
      c.beginPath();
      for (let x = 0; x <= w; x += step2) {
        const y = neonY(x, w, h, data, energy, t, 1);
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
      c.restore();
      try { c.filter = "none"; } catch (e) {}
      c.globalAlpha = 1;

      // Fade over reflectie heen
      const fade = c.createLinearGradient(0, h * 0.62, 0, h);
      fade.addColorStop(0, "rgba(0,0,0,0)");
      fade.addColorStop(1, "rgba(0,0,0,0.72)");
      c.fillStyle = fade;
      c.fillRect(0, h * 0.62, w, h * 0.38);
    }

    function drawNeonCtx(c, w, h, data, time, hasLive, freqData, timeData) {
      const fd = hasLive ? freqData : null;
      drawNeonWaves(c, w, h, data, time, fd, null);
    }

    let neonIdleRaf = null;
    function ensureNeonIdle() {
      if (state.waveformStyle !== "neon" || state.isPlaying || !state.waveformData) {
        if (neonIdleRaf) cancelAnimationFrame(neonIdleRaf);
        neonIdleRaf = null;
        return;
      }
      if (neonIdleRaf) return;
      const loop = () => {
        if (state.waveformStyle !== "neon" || state.isPlaying || !state.waveformData) {
          neonIdleRaf = null;
          return;
        }
        const ww = canvas.width / window.devicePixelRatio;
        const hh = canvas.height / window.devicePixelRatio;
        const tt = (state.pauseTime || 0) + performance.now() / 1000;
        ctx.clearRect(0, 0, ww, hh);
        if (state.bgMode === "gradient") {
          const grad = ctx.createLinearGradient(0, 0, 0, hh);
          grad.addColorStop(0, state.bgColor);
          grad.addColorStop(1, shiftColor(state.bgColor, 30));
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, ww, hh);
        }
        drawNeonWaves(ctx, ww, hh, state.waveformData, tt, null, null);
        neonIdleRaf = requestAnimationFrame(loop);
      };
      loop();
    }

    function roundRect(ctx, x, y, w, h, r) {
      if (h < 0) {
        y += h;
        h = Math.abs(h);
      }
      r = Math.min(r, h / 2, w / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function shiftColor(hex, amount) {
      hex = hex.replace("#", "");
      let r = parseInt(hex.substring(0, 2), 16);
      let g = parseInt(hex.substring(2, 4), 16);
      let b = parseInt(hex.substring(4, 6), 16);
      r = Math.min(255, r + amount);
      g = Math.min(255, g + amount);
      b = Math.min(255, b + amount);
      return `rgb(${r},${g},${b})`;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    // Playback
    const playBtn = $("#play-btn");

    playBtn.addEventListener("click", () => {
      if (state.isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    async function startPlayback() {
      if (!state.audioBuffer || !state.audioContext) return;

      if (state.audioContext.state === "suspended") {
        state.audioContext.resume().catch(e => console.error("[play] resume failed:", e));
      }

      state.sourceNode = state.audioContext.createBufferSource();
      state.sourceNode.buffer = state.audioBuffer;
      state.sourceNode.connect(state.analyserNode);
      state.analyserNode.connect(state.audioContext.destination);
      state.sourceNode.start(0, state.pauseTime);
      state.startTime = state.audioContext.currentTime - state.pauseTime;
      state.isPlaying = true;
      playBtn.textContent = "⏸";

      state.sourceNode.onended = () => {
        if (state.isPlaying) {
          state.isPlaying = false;
          state.pauseTime = 0;
          playBtn.textContent = "▶";
          ensureNeonIdle();
        }
      };

      animatePlayback();
    }

    function stopPlayback() {
      if (state.sourceNode) {
        state.sourceNode.onended = null;
        try { state.sourceNode.stop(); } catch (e) {}
      }
      if (state.audioContext) state.pauseTime = state.audioContext.currentTime - state.startTime;
      state.isPlaying = false;
      playBtn.textContent = "▶";
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      ensureNeonIdle();
    }

    function animatePlayback() {
      if (!state.isPlaying) return;

      const elapsed = state.audioContext.currentTime - state.startTime;
      const dur = state.audioBuffer.duration;
      const pct = Math.min(elapsed / dur, 1);

      $("#time-current").textContent = formatTime(elapsed);
      $("#progress-fill").style.width = pct * 100 + "%";

      // Read live frequency data from analyser
      if (state.analyserNode) {
        state.analyserNode.getByteFrequencyData(state.freqData);
        state.analyserNode.getByteTimeDomainData(state.timeData);
      }

      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      drawWaveformStyle(w, h, elapsed);

      if (pct < 1) {
        state.animFrame = requestAnimationFrame(animatePlayback);
      }
    }

    function drawPreviewFrame() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      const time = state.isPlaying
        ? state.audioContext.currentTime - state.startTime
        : state.pauseTime || 0;
      drawWaveformStyle(w, h, time);
      ensureNeonIdle();
    }

    // Progress bar click
    $("#progress-bar").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const newTime = pct * (state.audioBuffer?.duration || 0);

      if (state.isPlaying) stopPlayback();
      state.pauseTime = newTime;
      drawPreviewFrame();
      $("#time-current").textContent = formatTime(newTime);
      $("#progress-fill").style.width = pct * 100 + "%";
    });

    // Waveform style selection
    $$(".waveform-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        $$(".waveform-option").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        state.waveformStyle = btn.dataset.style;
        if (state.waveformData) drawPreviewFrame();
      });
    });

    // Color swatches
    $$("#bg-colors .color-swatch").forEach((s) => {
      s.addEventListener("click", () => {
        $$("#bg-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
        s.classList.add("selected");
        state.bgColor = s.dataset.color;
        drawIdle();
        if (state.waveformData) drawPreviewFrame();
      });
    });

    $$("#bar-colors .color-swatch").forEach((s) => {
      s.addEventListener("click", () => {
        $$("#bar-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
        s.classList.add("selected");
        state.barColor = s.dataset.color;
        if (state.waveformData) drawPreviewFrame();
      });
    });

    // Sliders
    $("#bar-width").addEventListener("input", (e) => {
      state.barWidth = +e.target.value;
      $("#bar-width-val").textContent = e.target.value;
      if (state.waveformData) drawPreviewFrame();
    });

    $("#bar-gap").addEventListener("input", (e) => {
      state.barGap = +e.target.value;
      $("#bar-gap-val").textContent = e.target.value;
      if (state.waveformData) drawPreviewFrame();
    });

    $("#smoothing").addEventListener("input", (e) => {
      state.smoothing = e.target.value / 100;
      $("#smoothing-val").textContent = (e.target.value / 100).toFixed(2);
      if (state.analyserNode) state.analyserNode.smoothingTimeConstant = state.smoothing;
      if (state.waveformData) drawPreviewFrame();
    });

    $("#resolution").addEventListener("change", (e) => {
      state.resolution = +e.target.value;
    });

    $("#export-format").addEventListener("change", (e) => {
      state.exportFormat = e.target.value;
    });

    // Export to video using canvas captureStream + MediaRecorder
    $("#export-btn").addEventListener("click", async () => {
      if (!state.audioBuffer) return;

      const formatConfig = {
        webm: {
          mimeTypes: ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"],
          ext: "webm",
          extensions: ["webm"],
        },
        "webm-vp8": {
          mimeTypes: ["video/webm;codecs=vp8", "video/webm"],
          ext: "webm",
          extensions: ["webm"],
        },
        mp4: {
          mimeTypes: ["video/mp4;codecs=h264", "video/mp4"],
          ext: "mp4",
          extensions: ["mp4"],
        },
      };
      const fmt = formatConfig[state.exportFormat] || formatConfig.webm;

      const savePath = await window.electronAPI.saveVideo(
        "waveform_" + state.waveformStyle + "." + fmt.ext,
        fmt.extensions
      );
      if (!savePath) return;

      if (state.isPlaying) stopPlayback();

      const overlay = $("#progress-overlay");
      overlay.classList.add("active");
      $("#export-btn").disabled = true;

      const resMap = {
        720: [1280, 720],
        1080: [1920, 1080],
        1440: [2560, 1440],
        2160: [3840, 2160],
      };
      const [exportW, exportH] = resMap[state.resolution] || [1920, 1080];

      const offscreen = document.createElement("canvas");
      offscreen.width = exportW;
      offscreen.height = exportH;
      const offCtx = offscreen.getContext("2d");

      const stream = offscreen.captureStream(60);
      let mimeType = fmt.mimeTypes.find(t => MediaRecorder.isTypeSupported(t));
      if (!mimeType) {
        mimeType = formatConfig.webm.mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || "";
      }
      const recorderOpts = { videoBitsPerSecond: 8000000 };
      if (mimeType) recorderOpts.mimeType = mimeType;
      const recorder = new MediaRecorder(stream, recorderOpts);

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createBufferSource();
      source.buffer = state.audioBuffer;
      const exportAnalyser = audioCtx.createAnalyser();
      exportAnalyser.fftSize = 2048;
      exportAnalyser.smoothingTimeConstant = state.smoothing;
      const exportFreqData = new Uint8Array(exportAnalyser.frequencyBinCount);
      const exportTimeData = new Uint8Array(exportAnalyser.frequencyBinCount);
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(exportAnalyser);
      exportAnalyser.connect(dest);
      exportAnalyser.connect(audioCtx.destination);

      const audioTracks = dest.stream.getAudioTracks();
      if (audioTracks.length > 0) {
        audioTracks.forEach((t) => stream.addTrack(t));
      }

      const duration = state.audioBuffer.duration;
      let frameCount = 0;
      const totalFrames = Math.ceil(duration * 60);

      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const buffer = await blob.arrayBuffer();
        const uint8 = new Uint8Array(buffer);
        let binary = "";
        const chunkSize = 8192;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          binary += String.fromCharCode.apply(
            null,
            uint8.subarray(i, i + chunkSize)
          );
        }
        const base64 = btoa(binary);

        await window.electronAPI.writeFile(base64, savePath);

        overlay.classList.remove("active");
        $("#export-btn").disabled = false;
        audioCtx.close();
      };

      recorder.start();

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(e => console.error("[export] resume failed:", e));
      }
      source.start(0);

      const exportStartTime = performance.now();
      let currentTime = 0;

      function renderFrame() {
        currentTime = (performance.now() - exportStartTime) / 1000;
        if (currentTime > duration + 0.1) {
          recorder.stop();
          source.stop();
          return;
        }

        offCtx.clearRect(0, 0, exportW, exportH);

        if (state.bgMode === "gradient") {
          const grad = offCtx.createLinearGradient(0, 0, 0, exportH);
          grad.addColorStop(0, state.bgColor);
          grad.addColorStop(1, shiftColor(state.bgColor, 30));
          offCtx.fillStyle = grad;
        } else {
          offCtx.fillStyle = state.bgColor;
        }
        offCtx.fillRect(0, 0, exportW, exportH);

        const data = state.waveformData;
        if (data) {
          exportAnalyser.getByteFrequencyData(exportFreqData);
          exportAnalyser.getByteTimeDomainData(exportTimeData);
          drawToCtx(offCtx, exportW, exportH, data, currentTime, exportFreqData, exportTimeData);
        }

        frameCount++;
        if (frameCount % 10 === 0) {
          const pct = Math.min(Math.floor((currentTime / duration) * 100), 100);
          $("#export-pct").textContent = pct + "%";
        }

        setTimeout(renderFrame, 0);
      }

      renderFrame();
    });

    function drawToCtx(targetCtx, w, h, data, time, freqData, timeData) {
      const hasLive = freqData && freqData.length > 0;

      switch (state.waveformStyle) {
        case "bars":
          drawBarsCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "wave":
          drawWaveCtx(targetCtx, w, h, data, time, hasLive, timeData);
          break;
        case "mirror":
          drawMirrorCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "circle":
          drawCircleCtx(targetCtx, w, h, data, hasLive, freqData);
          break;
        case "spectrum":
          drawSpectrumCtx(targetCtx, w, h, data, time, hasLive, freqData);
          break;
        case "neon":
          drawNeonCtx(targetCtx, w, h, data, time, hasLive, freqData, timeData);
          break;
      }
    }

    function drawBarsCtx(c, w, h, data, hasLive, freqData) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const step = Math.max(1, Math.floor(data.length / totalBars));
      const baseY = h * 0.85;
      const binCount = freqData ? freqData.length : 0;
      const useRound = barW > 4;

      for (let i = 0; i < totalBars && i * step < data.length; i++) {
        let val;
        if (hasLive && binCount > 0) {
          val = fftBarValue(freqData, i, totalBars, binCount);
        } else {
          val = data[i * step];
        }
        if (val < 0.02) continue;
        const barH = Math.max(2, val * h * 0.65);
        const x = i * (barW + gap);
        const y = baseY - barH;

        c.fillStyle = state.barColor;
        c.globalAlpha = 0.3 + val * 0.7;
        if (useRound) {
          c.beginPath();
          roundRectCtx(c, x, y, barW, barH, 2);
          c.fill();
        } else {
          c.fillRect(x, y, barW, barH);
        }
      }
      c.globalAlpha = 1;
    }

    function drawWaveCtx(c, w, h, data, time, hasLive, timeData) {
      const baseY = h / 2;
      const step = Math.max(1, Math.floor(w / 960));

      c.beginPath();
      c.strokeStyle = state.barColor + "30";
      c.lineWidth = 2;
      let started = false;
      for (let x = 0; x < w; x += step) {
        let val;
        if (hasLive && timeData && timeData.length > 0) {
          const tIdx = Math.floor((x / w) * timeData.length);
          val = (timeData[tIdx] - 128) / 128;
        } else {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          val = data[idx];
        }
        const y = baseY + val * h * 0.35 * Math.sin(x * 0.05 + time * 3);
        if (!started) { c.moveTo(x, y); started = true; }
        else c.lineTo(x, y);
      }
      c.stroke();

      c.beginPath();
      c.strokeStyle = state.barColor;
      c.lineWidth = 2.5;
      started = false;
      for (let x = 0; x < w; x += step) {
        let val;
        if (hasLive && timeData && timeData.length > 0) {
          const tIdx = Math.floor((x / w) * timeData.length);
          val = (timeData[tIdx] - 128) / 128;
        } else {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          val = data[idx];
        }
        const y = baseY - val * h * 0.35 * Math.sin(x * 0.05 + time * 3);
        if (!started) { c.moveTo(x, y); started = true; }
        else c.lineTo(x, y);
      }
      c.stroke();
    }

    function drawMirrorCtx(c, w, h, data, hasLive, freqData) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const step = Math.max(1, Math.floor(data.length / totalBars));
      const centerY = h / 2;
      const binCount = freqData ? freqData.length : 0;
      const useRound = barW > 4;

      for (let i = 0; i < totalBars && i * step < data.length; i++) {
        let val;
        if (hasLive && binCount > 0) {
          val = fftBarValue(freqData, i, totalBars, binCount);
        } else {
          val = data[i * step];
        }
        if (val < 0.02) continue;
        const barH = Math.max(2, val * h * 0.35);
        const x = i * (barW + gap);

        c.fillStyle = state.barColor;
        if (useRound) {
          c.beginPath();
          roundRectCtx(c, x, centerY - barH, barW, barH, 2);
          c.fill();
          c.fillStyle = state.barColor + "80";
          c.beginPath();
          roundRectCtx(c, x, centerY, barW, barH * 0.7, 2);
          c.fill();
        } else {
          c.fillRect(x, centerY - barH, barW, barH);
          c.fillStyle = state.barColor + "80";
          c.fillRect(x, centerY, barW, barH * 0.7);
        }
      }
    }

    function drawCircleCtx(c, w, h, data, hasLive, freqData) {
      const cx = w / 2;
      const cy = h / 2;
      const baseR = Math.min(w, h) * 0.28;
      const maxAmp = Math.min(w, h) * 0.22;
      const binCount = freqData ? freqData.length : 0;

      c.beginPath();
      c.strokeStyle = state.barColor;
      c.lineWidth = 2;
      const points = 180;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
        let val;
        if (hasLive && binCount > 0) {
          val = fftLogValue(freqData, i, points, binCount);
        } else {
          const dataIdx = Math.floor((i / points) * data.length);
          val = data[dataIdx] || 0;
        }
        const r = baseR + val * maxAmp;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.stroke();
    }

    function drawSpectrumCtx(c, w, h, data, time, hasLive, freqData) {
      const bands = 64;
      const bandW = w / bands;
      let fftData;
      if (hasLive && freqData && freqData.length > 0) {
        fftData = freqData;
      } else {
        fftData = state.audioBuffer
          ? extractFFTData(state.audioBuffer, time % state.audioBuffer.duration)
          : data;
      }

      for (let i = 0; i < bands; i++) {
        const idx = Math.floor((i / bands) * fftData.length);
        let val;
        if (hasLive) {
          val = fftData[idx] / 255;
        } else {
          val = fftData[idx] || 0;
        }
        const barH = Math.max(2, val * h * 0.85);
        const x = i * bandW;
        const hue = (i / bands) * 300;

        c.fillStyle = `hsla(${hue}, 80%, 60%, 0.9)`;

        c.beginPath();
        roundRectCtx(c, x + 1, h - barH, bandW - 2, barH, 2);
        c.fill();
      }
    }

    function roundRectCtx(c, x, y, w, h, r) {
      if (h < 0) {
        y += h;
        h = Math.abs(h);
      }
      r = Math.min(r, h / 2, w / 2);
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    // Preview canvases
    function drawPreviewBars() {
      const c = document.getElementById("preview-bars").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const bars = [0.4, 0.7, 1, 0.6, 0.9, 0.5, 0.8, 0.3, 0.7, 0.5, 0.9, 0.6, 0.45, 0.75];
      const barW = 3;
      const gap = (w - bars.length * barW) / (bars.length - 1);
      bars.forEach((v, i) => {
        c.fillStyle = "#7c5cfc";
        c.fillRect(i * (barW + gap), h - v * h, barW, v * h);
      });
    }

    function drawPreviewWave() {
      const c = document.getElementById("preview-wave").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 2;
      c.beginPath();
      for (let x = 0; x < w; x++) {
        const y = h / 2 + Math.sin(x * 0.3) * 12;
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
      c.strokeStyle = "#7c5cfc30";
      c.lineWidth = 1.5;
      c.beginPath();
      for (let x = 0; x < w; x++) {
        const y = h / 2 - Math.sin(x * 0.3) * 12;
        if (x === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.stroke();
    }

    function drawPreviewMirror() {
      const c = document.getElementById("preview-mirror").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const vals = [0.4, 0.8, 1, 0.6, 0.9, 0.5, 0.8, 0.4, 0.7, 0.65];
      const barW = 4;
      const gap = (w - vals.length * barW) / (vals.length - 1);
      vals.forEach((v, i) => {
        c.fillStyle = "#7c5cfc";
        c.fillRect(i * (barW + gap), h / 2 - v * 14, barW, v * 14);
        c.fillStyle = "#7c5cfc60";
        c.fillRect(i * (barW + gap), h / 2, barW, v * 10);
      });
    }

    function drawPreviewCircle() {
      const c = document.getElementById("preview-circle").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.strokeStyle = "#7c5cfc20";
      c.lineWidth = 1;
      c.beginPath();
      c.arc(w / 2, h / 2, 10, 0, Math.PI * 2);
      c.stroke();
      c.strokeStyle = "#7c5cfc";
      c.lineWidth = 2;
      c.beginPath();
      for (let i = 0; i <= 60; i++) {
        const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
        const val = 0.5 + 0.5 * Math.sin(i * 0.5);
        const r = 10 + val * 6;
        const x = w / 2 + Math.cos(angle) * r;
        const y = h / 2 + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.stroke();
    }

    function drawPreviewSpectrum() {
      const c = document.getElementById("preview-spectrum").getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      const vals = [0.5, 0.8, 1, 0.7, 0.9, 0.6, 0.8, 1, 0.7, 0.5, 0.9, 0.4, 0.75, 0.65];
      const barW = 3;
      const gap = (w - vals.length * barW) / (vals.length - 1);
      vals.forEach((v, i) => {
        const hue = (i / vals.length) * 300;
        c.fillStyle = `hsla(${hue}, 80%, 60%, 0.9)`;
        c.fillRect(i * (barW + gap), h - v * h, barW, v * h);
      });
    }

    function drawPreviewNeon() {
      const el = document.getElementById("preview-neon");
      if (!el) return;
      const c = el.getContext("2d");
      const w = 64, h = 44;
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#050508";
      c.fillRect(0, 0, w, h);
      // stars
      c.fillStyle = "#ffffff";
      for (let i = 0; i < 22; i++) {
        c.globalAlpha = 0.25 + seededRand(i + 50) * 0.6;
        c.beginPath();
        c.arc(seededRand(i * 2 + 1) * w, seededRand(i * 2 + 2) * h, 0.6, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
      const wave = (layer, color, width, phase) => {
        c.save();
        c.strokeStyle = color;
        c.lineWidth = width;
        c.shadowColor = color;
        c.shadowBlur = 5;
        c.beginPath();
        for (let x = 0; x <= w; x += 1) {
          const env = 0.35 + 0.65 * Math.sin(Math.PI * (x / w));
          const y = h * 0.46 + Math.sin(x * 0.18 + phase) * 7 * env + Math.sin(x * 0.45 + phase * 1.6 + layer) * 3 * env;
          if (x === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.stroke();
        c.restore();
      };
      wave(0, "#ff5fd2", 1.6, 0.5);
      wave(1, "#22e6ff", 1.6, 1.7);
      wave(2, "#ff8de0", 0.9, 3.0);
    }

    drawPreviewBars();
    drawPreviewWave();
    drawPreviewMirror();
    drawPreviewCircle();
    drawPreviewSpectrum();
    drawPreviewNeon();
  </script>
</body>
</html>
