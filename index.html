<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface-hover: #1a1a24;
      --border: #2a2a35;
      --text: #e8e8ef;
      --text-dim: #7a7a8a;
      --accent: #7c5cfc;
      --accent-hover: #9478ff;
      --danger: #fc5c7c;
      --success: #5cfc9c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    button, input, select, .color-swatch, .waveform-option, a {
      -webkit-app-region: no-drag;
    }

    .titlebar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      -webkit-app-region: drag;
      position: relative;
    }

    .titlebar h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-left: 60px;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 52px);
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-app-region: no-drag;
      will-change: scroll-position;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar::-webkit-scrollbar {
      width: 10px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
      border: 2px solid var(--surface);
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    .sidebar h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .file-drop:hover,
    .file-drop.dragover {
      border-color: var(--accent);
      background: rgba(124, 92, 252, 0.05);
    }

    .file-drop .icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    .file-drop p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .file-drop .filename {
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      word-break: break-all;
    }

    .waveform-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .waveform-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .waveform-option:hover {
      background: var(--surface-hover);
    }

    .waveform-option.selected {
      border-color: var(--accent);
      background: rgba(124, 92, 252, 0.08);
    }

    .waveform-option .preview {
      width: 64px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
      display: block;
      image-rendering: crisp-edges;
    }

    .waveform-option .preview-wrap {
      width: 64px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg);
      flex-shrink: 0;
      overflow: hidden;
    }

    .waveform-option .preview-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .waveform-option .label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .waveform-option .desc {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-row label {
      font-size: 13px;
      color: var(--text-dim);
    }

    .control-row .value {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      min-width: 40px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      margin-top: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
    }

    .color-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .color-custom {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px dashed var(--border);
      padding: 0;
      background: conic-gradient(#f55, #ff5, #5f5, #5ff, #55f, #f5f, #f55);
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-custom:hover {
      transform: scale(1.1);
      border-color: var(--accent);
    }

    .color-custom::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .color-custom::-webkit-color-swatch {
      border: none;
      border-radius: 5px;
    }

    .bg-image-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .bg-image-btn {
      flex: 1;
      background: var(--bg);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bg-image-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      width: 100%;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .export-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      margin-top: auto;
      letter-spacing: 0.3px;
    }

    .export-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .export-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      -webkit-app-region: no-drag;
    }

    .canvas-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #waveform-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }

    .play-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .skip-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, transform 0.15s;
    }

    .skip-btn:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .speed-btn {
      min-width: 44px;
      height: 28px;
      border-radius: 14px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      font-family: "SF Mono", "Menlo", monospace;
      cursor: pointer;
      padding: 0 10px;
      transition: border-color 0.15s;
    }

    .speed-btn:hover {
      border-color: var(--accent);
    }

    .time-display {
      font-size: 13px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", monospace;
    }

    .progress-bar {
      flex: 1;
      max-width: 400px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.05s linear;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
    }

    .empty-state .icon {
      font-size: 64px;
      opacity: 0.15;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 13px;
      opacity: 0.5;
    }

    .progress-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
      z-index: 10;
      display: none;
    }

    .progress-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-overlay p {
      font-size: 14px;
      color: var(--text-dim);
    }

    .progress-overlay .pct {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>Wavy</h1>
  </div>

  <div class="app">
    <div class="sidebar">
      <div class="control-group">
        <h2>Audio Source</h2>
        <div class="file-drop" id="file-drop">
          <div class="icon">🎵</div>
          <p id="file-drop-text">Click or drop an audio file here<br /><span style="font-size:11px; opacity:0.5">MP3, WAV, OGG, FLAC, AAC</span></p>
        </div>
      </div>

      <div class="control-group">
        <h2>Waveform Style</h2>
        <div class="waveform-options" id="waveform-options">
          <button class="waveform-option selected" data-style="bars">
            <div class="preview-wrap"><canvas class="preview" id="preview-bars" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Bars</div>
              <div class="desc">Classic vertical bars</div>
            </div>
          </button>
          <button class="waveform-option" data-style="wave">
            <div class="preview-wrap"><canvas class="preview" id="preview-wave" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Wave</div>
              <div class="desc">Smooth continuous line</div>
            </div>
          </button>
          <button class="waveform-option" data-style="mirror">
            <div class="preview-wrap"><canvas class="preview" id="preview-mirror" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Mirror</div>
              <div class="desc">Symmetric bars, top & bottom</div>
            </div>
          </button>
          <button class="waveform-option" data-style="circle">
            <div class="preview-wrap"><canvas class="preview" id="preview-circle" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Circle</div>
              <div class="desc">Radial pulsing ring</div>
            </div>
          </button>
          <button class="waveform-option" data-style="orbit">
            <div class="preview-wrap"><canvas class="preview" id="preview-orbit" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Orbit</div>
              <div class="desc">Circular spectrum bars</div>
            </div>
          </button>
          <button class="waveform-option" data-style="spectrum">
            <div class="preview-wrap"><canvas class="preview" id="preview-spectrum" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Spectrum</div>
              <div class="desc">FFT frequency bands</div>
            </div>
          </button>
          <button class="waveform-option" data-style="neon">
            <div class="preview-wrap"><canvas class="preview" id="preview-neon" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Neon Flow</div>
              <div class="desc">Glowing dual wave + stars</div>
            </div>
          </button>
          <button class="waveform-option" data-style="particles">
            <div class="preview-wrap"><canvas class="preview" id="preview-particles" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Particles</div>
              <div class="desc">Dancing particle field</div>
            </div>
          </button>
          <button class="waveform-option" data-style="spiral">
            <div class="preview-wrap"><canvas class="preview" id="preview-spiral" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Spiral</div>
              <div class="desc">Rotating audio helix</div>
            </div>
          </button>
          <button class="waveform-option" data-style="scope">
            <div class="preview-wrap"><canvas class="preview" id="preview-scope" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Oscilloscope</div>
              <div class="desc">Retro phosphor scope</div>
            </div>
          </button>
          <button class="waveform-option" data-style="flow">
            <div class="preview-wrap"><canvas class="preview" id="preview-flow" width="128" height="88"></canvas></div>
            <div>
              <div class="label">Gradient Fill</div>
              <div class="desc">Filled wave, fading glow</div>
            </div>
          </button>
        </div>
      </div>

      <div class="control-group">
        <h2>Resolution</h2>
        <select id="resolution">
          <option value="720">720p (1280×720)</option>
          <option value="1080" selected>1080p (1920×1080)</option>
          <option value="1440">1440p (2560×1440)</option>
          <option value="2160">4K (3840×2160)</option>
        </select>
      </div>

      <div class="control-group">
        <h2>Format</h2>
        <select id="export-format">
          <option value="webm" selected>WebM (VP9)</option>
          <option value="webm-vp8">WebM (VP8)</option>
          <option value="mp4">MP4 (H.264)</option>
        </select>
      </div>

      <div class="control-group">
        <h2>Background</h2>
        <select id="bg-mode">
          <option value="solid" selected>Solid Color</option>
          <option value="gradient">Gradient</option>
          <option value="image">Image</option>
        </select>
        <div class="color-row" id="bg-colors">
          <div class="color-swatch selected" style="background:#0a0a0f" data-color="#0a0a0f"></div>
          <div class="color-swatch" style="background:#1a1a2e" data-color="#1a1a2e"></div>
          <div class="color-swatch" style="background:#0f0f0f" data-color="#0f0f0f"></div>
          <div class="color-swatch" style="background:#0d1117" data-color="#0d1117"></div>
          <div class="color-swatch" style="background:#1a0a2e" data-color="#1a0a2e"></div>
          <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
          <input type="color" class="color-custom" id="bg-custom" value="#0a0a0f" title="Kies eigen kleur" />
        </div>
        <div class="bg-image-row" id="bg-image-row" style="display:none">
          <button class="bg-image-btn" id="bg-image-btn">Choose image…</button>
          <input type="file" id="bg-image-input" accept="image/*" style="display:none" />
        </div>
      </div>

      <div class="control-group">
        <h2>Bar Color</h2>
        <div class="color-row" id="bar-colors">
          <div class="color-swatch selected" style="background:#7c5cfc" data-color="#7c5cfc"></div>
          <div class="color-swatch" style="background:#00d4ff" data-color="#00d4ff"></div>
          <div class="color-swatch" style="background:#ff6b6b" data-color="#ff6b6b"></div>
          <div class="color-swatch" style="background:#5cfc9c" data-color="#5cfc9c"></div>
          <div class="color-swatch" style="background:#ffc53d" data-color="#ffc53d"></div>
          <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
          <input type="color" class="color-custom" id="bar-custom" value="#7c5cfc" title="Kies eigen kleur" />
        </div>
      </div>

      <div class="control-group">
        <h2>Bar Width <span class="value" id="bar-width-val">4</span></h2>
        <input type="range" id="bar-width" min="2" max="12" value="4" />
      </div>

      <div class="control-group">
        <h2>Bar Gap <span class="value" id="bar-gap-val">2</span></h2>
        <input type="range" id="bar-gap" min="1" max="8" value="2" />
      </div>

      <div class="control-group">
        <h2>Smoothing <span class="value" id="smoothing-val">0.8</span></h2>
        <input type="range" id="smoothing" min="0" max="99" value="80" />
      </div>

      <button class="export-btn" id="export-btn" disabled>Export Video</button>
    </div>

    <div class="main-area">
      <div class="canvas-container" id="canvas-container">
        <canvas id="waveform-canvas"></canvas>
        <div class="progress-overlay" id="progress-overlay">
          <div class="spinner"></div>
          <div class="pct" id="export-pct">0%</div>
          <p>Rendering waveform video...</p>
        </div>
      </div>

      <div class="playback-controls" id="playback-controls" style="display:none">
        <button class="skip-btn" id="skip-back" title="10 seconden terug">⏪</button>
        <button class="play-btn" id="play-btn">▶</button>
        <button class="skip-btn" id="skip-fwd" title="10 seconden vooruit">⏩</button>
        <button class="speed-btn" id="speed-btn" title="Afspeelsnelheid">1×</button>
        <span class="time-display" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time-display" id="time-total">0:00</span>
      </div>

      <div class="empty-state" id="empty-state">
        <div class="icon">〰️</div>
        <h3>No audio loaded</h3>
        <p>Drop a file to see the waveform preview</p>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      const m = msg + " at " + src + ":" + line + ":" + col;
      console.error(m);
      try { window.electronAPI.logError(m); } catch(e) {}
    };
    window.addEventListener("unhandledrejection", function(e) {
      console.error("Unhandled promise:", e.reason);
      try { window.electronAPI.logError("Promise: " + e.reason); } catch(x) {}
    });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const state = {
      audioBuffer: null,
      audioContext: null,
      sourceNode: null,
      analyserNode: null,
      freqData: null,
      timeData: null,
      isPlaying: false,
      startTime: 0,
      pauseTime: 0,
      waveformStyle: "bars",
      bgColor: "#0a0a0f",
      barColor: "#7c5cfc",
      barWidth: 4,
      barGap: 2,
      smoothing: 0.8,
      resolution: 1080,
      exportFormat: "webm",
      bgMode: "solid",
      waveformData: null,
      animFrame: null,
      playbackRate: 1,
      beatPulse: 0,
      beatHist: [],
      particleFlow: 1,
      bgImage: null,
      bgImageName: "",
    };

    const canvas = $("#waveform-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = $("#canvas-container");
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      drawIdle();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawIdle() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      paintBackground(ctx, w, h);

      ctx.strokeStyle = state.barColor + "30";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    // File handling
    const dropZone = $("#file-drop");

    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => e.preventDefault());

    dropZone.addEventListener("click", async () => {
      const file = await window.electronAPI.openAudioFile();
      if (file) loadAudioFile(file);
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        try {
          const filePath = window.electronAPI.getFilePath(files[0]);
          const file = await window.electronAPI.readAudioFile(filePath);
          if (file) loadAudioFile(file);
        } catch (err) {
          console.error("Failed to read dropped file:", err);
          alert("Could not read file: " + err.message);
        }
      }
    });

    async function loadAudioFileRaw(fileName, arrayBuffer) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        state.audioBuffer = audioBuffer;
        state.audioContext = audioCtx;
        state.pauseTime = 0;
        state.waveformData = extractWaveformData(audioBuffer);

        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = state.smoothing;
        state.analyserNode = analyser;
        state.freqData = new Uint8Array(analyser.frequencyBinCount);
        state.timeData = new Uint8Array(analyser.frequencyBinCount);

        $("#file-drop-text").innerHTML = `<div class="filename">${fileName}</div>`;
        $("#export-btn").disabled = false;
        $("#playback-controls").style.display = "flex";
        $("#empty-state").style.display = "none";

        const dur = audioBuffer.duration;
        $("#time-total").textContent = formatTime(dur);
        $("#time-current").textContent = "0:00";

        drawPreviewFrame();
      } catch (err) {
        console.error("Failed to load audio:", err);
        alert("Could not load audio file: " + err.message);
      }
    }

    async function loadAudioFile(file) {
      const bytes = atob(file.buffer);
      const raw = new ArrayBuffer(bytes.length);
      const view = new Uint8Array(raw);
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const slice = bytes.slice(i, i + chunkSize);
        for (let j = 0; j < slice.length; j++) {
          view[i + j] = slice.charCodeAt(j);
        }
      }
      await loadAudioFileRaw(file.fileName, raw);
    }

    function extractWaveformData(audioBuffer) {
      const channelData = audioBuffer.getChannelData(0);
      const samples = 512;
      const blockSize = Math.floor(channelData.length / samples);
      const data = [];

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        const start = i * blockSize;
        for (let j = 0; j < blockSize; j++) {
          sum += Math.abs(channelData[start + j] || 0);
        }
        data.push(sum / blockSize);
      }

      const max = Math.max(...data, 0.001);
      return data.map((v) => v / max);
    }

    function extractFFTData(audioBuffer, timeIndex) {
      const sampleRate = audioBuffer.sampleRate;
      const channelData = audioBuffer.getChannelData(0);
      const fftSize = 256;
      const start = Math.floor(timeIndex * sampleRate);
      const slice = channelData.slice(start, start + fftSize);

      const data = [];
      for (let i = 0; i < slice.length / 2; i++) {
        let sum = 0;
        for (let j = 0; j < 2; j++) {
          const idx = i * 2 + j;
          if (idx < slice.length) sum += Math.abs(slice[idx]);
        }
        data.push(sum / 2);
      }

      const max = Math.max(...data, 0.001);
      return data.map((v) => v / max);
    }

    // Waveform drawing
    function drawWaveformStyle(w, h, time) {
      ctx.clearRect(0, 0, w, h);
      paintBackground(ctx, w, h);

      const data = state.waveformData;
      if (!data) return;

      const progress = state.audioBuffer
        ? time / state.audioBuffer.duration
        : 0;
      const playedSamples = Math.floor(progress * data.length);
      const live = state.isPlaying && state.freqData;

      switch (state.waveformStyle) {
        case "bars":
          drawBars(w, h, data, playedSamples, live);
          break;
        case "wave":
          drawWave(w, h, data, playedSamples, live);
          break;
        case "mirror":
          drawMirror(w, h, data, playedSamples, live);
          break;
        case "circle":
          drawCircle(w, h, data, playedSamples, live);
          break;
        case "spectrum":
          drawSpectrum(w, h, data, time, playedSamples, live);
          break;
        case "neon":
          drawNeon(w, h, data, time, playedSamples, live);
          break;
        case "particles":
          drawParticles(w, h, data, time, playedSamples, live);
          break;
        case "orbit":
          drawOrbit(w, h, data, time, playedSamples, live);
          break;
        case "spiral":
          drawSpiral(w, h, data, time, playedSamples, live);
          break;
        case "scope":
          drawScope(w, h, data, time, playedSamples, live);
          break;
        case "flow":
          drawFlow(w, h, data, time, playedSamples, live);
          break;
      }
    }

    function fftBarValue(fft, bar, totalBars, binCount) {
      const startIdx = Math.floor((bar / totalBars) * binCount);
      const endIdx = Math.max(startIdx + 1, Math.floor(((bar + 1) / totalBars) * binCount));
      let sum = 0;
      let count = 0;
      for (let i = startIdx; i < endIdx && i < binCount; i++) {
        sum += fft[i];
        count++;
      }
      return count > 0 ? sum / count / 255 : 0;
    }

    function fftLogValue(fft, point, totalPoints, binCount) {
      const usableBins = Math.floor(binCount * 0.8);
      const t = point / totalPoints;
      const startIdx = Math.min(Math.floor(Math.pow(t, 1.2) * usableBins), usableBins - 1);
      const tNext = (point + 1) / totalPoints;
      const endIdx = Math.min(Math.max(startIdx + 1, Math.floor(Math.pow(tNext, 1.2) * usableBins)), usableBins);
      let sum = 0;
      let count = 0;
      for (let i = startIdx; i < endIdx; i++) {
        const boost = 1 + (i / usableBins) * 1.5;
        sum += Math.min(255, fft[i] * boost);
        count++;
      }
      return count > 0 ? sum / count / 255 : 0;
    }

    function drawBars(w, h, data, played, live) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const baseY = h * 0.85;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < totalBars; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, totalBars, binCount);
        } else {
          const step = Math.max(1, Math.floor(data.length / totalBars));
          val = (i * step < data.length) ? data[i * step] : 0;
        }
        const barH = Math.max(2, val * h * 0.65);
        const x = i * (barW + gap);

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.3 + val * 0.7;
        ctx.beginPath();
        roundRect(ctx, x, baseY - barH, barW, barH, barW > 4 ? 2 : 1);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawWave(w, h, data, played, live) {
      const baseY = h / 2;
      const fft = state.freqData;
      const time = state.timeData;
      const binCount = fft ? fft.length : 0;

      // Background line
      ctx.beginPath();
      ctx.strokeStyle = state.barColor + "30";
      ctx.lineWidth = 2;
      for (let x = 0; x < w; x++) {
        const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
        const val = data[idx] * h * 0.35;
        const y = baseY + val * Math.sin(x * 0.05 + Date.now() * 0.002);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Live waveform from time domain data
      ctx.beginPath();
      ctx.strokeStyle = state.barColor;
      ctx.lineWidth = 2.5;
      if (live && time) {
        const sliceWidth = w / time.length;
        for (let i = 0; i < time.length; i++) {
          const v = (time[i] - 128) / 128;
          const y = baseY + v * h * 0.4;
          const x = i * sliceWidth;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      } else {
        for (let x = 0; x < w; x++) {
          const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
          const val = data[idx] * h * 0.35;
          const y = baseY - val * Math.sin(x * 0.05 + Date.now() * 0.002);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      if (played > 0) {
        const px = (played / data.length) * w;
        ctx.fillStyle = state.barColor + "10";
        ctx.fillRect(0, 0, px, h);
      }
    }

    function drawMirror(w, h, data, played, live) {
      const barW = state.barWidth;
      const gap = state.barGap;
      const totalBars = Math.floor(w / (barW + gap));
      const centerY = h / 2;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < totalBars; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, totalBars, binCount);
        } else {
          const step = Math.max(1, Math.floor(data.length / totalBars));
          val = (i * step < data.length) ? data[i * step] : 0;
        }
        const barH = Math.max(2, val * h * 0.35);
        const x = i * (barW + gap);

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.3 + val * 0.7;
        ctx.beginPath();
        roundRect(ctx, x, centerY - barH, barW, barH, barW > 4 ? 2 : 1);
        ctx.fill();

        ctx.fillStyle = state.barColor;
        ctx.globalAlpha = 0.2 + val * 0.5;
        ctx.beginPath();
        roundRect(ctx, x, centerY, barW, barH * 0.7, barW > 4 ? 2 : 1);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawCircle(w, h, data, played, live) {
      const cx = w / 2;
      const cy = h / 2;
      const baseR = Math.min(w, h) * 0.28;
      const maxAmp = Math.min(w, h) * 0.22;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      ctx.fillStyle = state.barColor + "06";
      ctx.beginPath();
      ctx.arc(cx, cy, baseR + maxAmp * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = state.barColor;
      ctx.lineWidth = 2;
      const points = 180;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
        let val;
        if (live && binCount > 0) {
          val = fftLogValue(fft, i, points, binCount);
        } else {
          const dataIdx = Math.floor((i / points) * data.length);
          val = data[dataIdx] || 0;
        }
        const r = baseR + val * maxAmp;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = state.barColor + "15";
      ctx.lineWidth = 1;
      ctx.arc(cx, cy, baseR * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawSpectrum(w, h, data, time, played, live) {
      const bands = 64;
      const bandW = w / bands;
      const fft = state.freqData;
      const binCount = fft ? fft.length : 0;

      for (let i = 0; i < bands; i++) {
        let val;
        if (live && binCount > 0) {
          val = fftBarValue(fft, i, bands, binCount);
        } else {
          const fftData = state.audioBuffer
            ? extractFFTData(state.audioBuffer, time % state.audioBuffer.duration)
            : data;
          const idx = Math.floor((i / bands) * fftData.length);
          val = fftData[idx] || 0;
        }
        const barH = Math.max(2, val * h * 0.85);
        const x = i * bandW;
        const hue = (i / bands) * 300;

        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.15 + val * 0.85})`;
        ctx.beginPath();
        roundRect(ctx, x + 1, h - barH, bandW - 2, barH, 2);
        ctx.fill();
      }
    }

    // ---------- Nieuwe stijlen: Particles / Spiral / Scope / Flow ----------
    function styleBeat(freqData) {
      const live = !!(freqData && freqData.length > 0);
      const bands = live ? neonBands(freqData) : { bass: 0, mid: 0, high: 0, level: 0.5 };
      const pulse = live ? updateBeat(bands.bass) : 0.3 + 0.2 * Math.sin(performance.now() / 1000 * 1.4);
      return { live, bands, pulse };
    }

    function paintParticles(c, w, h, data, time, freqData) {
      const { live, bands, pulse } = styleBeat(freqData);
      const col2 = getNeonColors()[1];
      const scale = Math.max(0.6, w / 1280);
      const N = 140;
      // Regen: afgevlakte flow zodat snelle beats achter elkaar niet alles
      // in één keer laten exploderen; plafond op ~2.2x valsnelheid
      const rawFlow = live ? 1 + Math.min(1, pulse) * 1.1 + Math.min(1, bands.bass) * 0.5 : 0.7;
      const prev = state.particleFlow || 1;
      const k = rawFlow > prev ? 0.22 : 0.07;
      const fallBoost = Math.min(2.2, prev + (rawFlow - prev) * k);
      state.particleFlow = fallBoost;
      const pump = 1 + pulse * 0.9 + bands.bass * 0.5;
      const span = h + 30 * scale;
      for (let i = 0; i < N; i++) {
        const s1 = seededRand(i * 3 + 11), s2 = seededRand(i * 3 + 12), s3 = seededRand(i * 3 + 13);
        let v;
        if (live) v = fftLogValue(freqData, i, N, freqData.length);
        else v = data[Math.floor((i / N) * data.length)] || 0;
        v = Math.min(1, v * pump);
        // Valsnelheid per druppel; op de beat valt alles veel sneller naar beneden
        const speed = (26 + s2 * 90) * fallBoost * scale + 8;
        const y = h + 12 * scale - ((s3 * span + time * speed) % span);
        // Licht heen-en-weer waaien tijdens het vallen
        const x = s1 * w + Math.sin(time * (0.8 + s2) + i * 1.7) * 8 * scale;
        const r = (0.8 + v * 5.0 + s3 * 1.4) * scale;
        const col = i % 3 === 2 ? col2 : state.barColor;
        // Vallijn (motion streak) achter felle druppels
        if (v > 0.35) {
          c.save();
          c.globalAlpha = (0.10 + v * 0.25) * (live ? 1 : 0.7);
          c.strokeStyle = col;
          c.lineWidth = Math.max(1, r * 0.7);
          c.lineCap = "round";
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(x, y - (6 + v * 26 * fallBoost) * scale);
          c.stroke();
          c.restore();
        }
        c.save();
        c.globalAlpha = 0.20 + v * 0.45;
        c.fillStyle = col;
        c.beginPath();
        c.arc(x, y, r * 2.2, 0, Math.PI * 2);
        c.fill();
        c.globalAlpha = 0.5 + v * 0.5;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function paintSpiral(c, w, h, data, time, freqData) {
      const { live, bands, pulse } = styleBeat(freqData);
      const col2 = getNeonColors()[1];
      const scale = Math.max(0.6, w / 1280);
      const cx = w / 2, cy = h / 2;
      const maxR = Math.min(w, h) * 0.42;
      const turns = 3, points = 220;
      const rot = time * (live ? 1.1 + pulse * 1.2 : 0.35);
      const pump = 1 + pulse * 0.6 + bands.bass * 0.4;
      const arms = [
        { off: 0, col: state.barColor, lw: 2.4 },
        { off: Math.PI, col: col2, lw: 2.0 },
      ];
      for (const arm of arms) {
        const passes = [
          { m: 3.2, a: 0.25, blur: 18 * scale },
          { m: 1.3, a: 0.9, blur: 10 * scale },
        ];
        for (const p of passes) {
          c.save();
          c.globalAlpha = p.a;
          c.strokeStyle = arm.col;
          c.lineWidth = Math.max(1, arm.lw * scale * p.m * 0.6);
          c.lineJoin = "round";
          c.lineCap = "round";
          c.shadowColor = arm.col;
          c.shadowBlur = p.blur * (1 + pulse * 0.7);
          c.beginPath();
          for (let i = 0; i <= points; i++) {
            const f = i / points;
            const a = arm.off + rot + f * Math.PI * 2 * turns;
            let v;
            if (live) v = fftLogValue(freqData, i, points, freqData.length);
            else v = data[Math.floor(f * (data.length - 1))] || 0;
            const r = maxR * (0.12 + 0.88 * f) * (0.55 + v * 1.0 * pump);
            const x = cx + Math.cos(a) * r;
            const y = cy + Math.sin(a) * r * 0.62;
            if (i === 0) c.moveTo(x, y);
            else c.lineTo(x, y);
          }
          c.stroke();
          c.restore();
        }
      }
      // Pulserende kern
      c.save();
      const cr = (6 + pulse * 14 + bands.bass * 10) * scale;
      const g = c.createRadialGradient(cx, cy, 0, cx, cy, cr * 3);
      g.addColorStop(0, rgba(state.barColor, 0.8));
      g.addColorStop(1, rgba(state.barColor, 0));
      c.fillStyle = g;
      c.beginPath();
      c.arc(cx, cy, cr * 3, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function paintScope(c, w, h, data, time, freqData, timeData) {
      const { live, bands, pulse } = styleBeat(freqData);
      const scale = Math.max(0.6, w / 1280);
      // Raster
      c.save();
      c.strokeStyle = "rgba(255,255,255,0.07)";
      c.lineWidth = 1;
      const stepX = w / 12, stepY = h / 8;
      c.beginPath();
      for (let x = stepX; x < w; x += stepX) { c.moveTo(x, 0); c.lineTo(x, h); }
      for (let y = stepY; y < h; y += stepY) { c.moveTo(0, y); c.lineTo(w, y); }
      c.stroke();
      c.strokeStyle = rgba(state.barColor, 0.25);
      c.beginPath();
      c.moveTo(0, h / 2); c.lineTo(w, h / 2);
      c.moveTo(w / 2, 0); c.lineTo(w / 2, h);
      c.stroke();
      c.restore();
      // Trace
      const N = Math.min(900, Math.floor(w));
      const cy = h / 2;
      const amp = h * 0.36 * (0.5 + bands.level * 0.7) * (1 + pulse * 0.35);
      const trace = () => {
        c.beginPath();
        for (let i = 0; i <= N; i++) {
          const x = (i / N) * w;
          let v;
          if (live && timeData && timeData.length > 0) {
            v = ((timeData[Math.floor((i / N) * timeData.length)] || 128) - 128) / 128;
          } else {
            const idx = Math.floor((i / N) * (data.length - 1));
            v = ((data[idx] || 0) - 0.5) * 2 * Math.sin((i / N) * Math.PI);
          }
          const y = cy + v * amp;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
      };
      c.save();
      c.lineJoin = "round";
      c.globalAlpha = 0.3;
      c.strokeStyle = state.barColor;
      c.lineWidth = Math.max(2, 7 * scale);
      c.shadowColor = state.barColor;
      c.shadowBlur = 22 * scale * (1 + pulse * 0.6);
      trace(); c.stroke();
      c.globalAlpha = 0.95;
      c.lineWidth = Math.max(1.2, 2.2 * scale);
      c.shadowBlur = 10 * scale;
      trace(); c.stroke();
      c.globalAlpha = 0.9;
      c.strokeStyle = "rgba(255,255,255,0.85)";
      c.lineWidth = Math.max(1, scale);
      c.shadowBlur = 0;
      trace(); c.stroke();
      c.restore();
      // Scanlines
      c.save();
      c.fillStyle = "rgba(0,0,0,0.10)";
      for (let y = 0; y < h; y += Math.max(3, Math.floor(4 * scale))) c.fillRect(0, y, w, 1);
      c.restore();
    }

    function paintFlow(c, w, h, data, time, freqData, timeData) {
      const { live, bands, pulse } = styleBeat(freqData);
      const scale = Math.max(0.6, w / 1280);
      const N = Math.min(720, Math.floor(w / 2));
      const cy = h / 2;
      const pump = 1 + pulse * 0.7 + bands.bass * 0.4;
      const amp = h * 0.30 * (0.45 + bands.level * 0.8) * pump;
      const ys = [];
      for (let i = 0; i <= N; i++) {
        const x = (i / N) * w;
        const nx = i / N;
        let v;
        if (live && timeData && timeData.length > 0) {
          v = ((timeData[Math.floor(nx * timeData.length)] || 128) - 128) / 128;
        } else {
          v = (((data[Math.floor(nx * (data.length - 1))] || 0)) - 0.5) * 2;
        }
        const wob = Math.sin(nx * 9 + time * (live ? 2.2 : 1.0)) * 0.25;
        ys.push(cy + (v * 0.8 + wob) * amp * (0.25 + 0.75 * Math.sin(Math.PI * nx)));
      }
      const xs = (i) => (i / N) * w;
      // Vulling met verticaal verloop
      c.save();
      const g = c.createLinearGradient(0, cy - amp, 0, cy + amp);
      g.addColorStop(0, rgba(state.barColor, 0.02));
      g.addColorStop(0.5, rgba(state.barColor, 0.55 + Math.min(0.3, pulse * 0.3)));
      g.addColorStop(1, rgba(state.barColor, 0.02));
      c.fillStyle = g;
      c.shadowColor = state.barColor;
      c.shadowBlur = 24 * scale * (1 + pulse * 0.6);
      c.beginPath();
      c.moveTo(xs(0), cy);
      for (let i = 0; i <= N; i++) c.lineTo(xs(i), ys[i]);
      c.lineTo(xs(N), cy);
      c.closePath();
      c.fill();
      c.restore();
      // Heldere bovenlijn
      c.save();
      c.strokeStyle = state.barColor;
      c.lineWidth = Math.max(1.5, 2.4 * scale);
      c.lineJoin = "round";
      c.shadowColor = state.barColor;
      c.shadowBlur = 14 * scale * (1 + pulse * 0.6);
      c.beginPath();
      c.moveTo(xs(0), ys[0]);
      for (let i = 1; i <= N; i++) c.lineTo(xs(i), ys[i]);
      c.stroke();
      c.globalAlpha = 0.85;
      c.strokeStyle = "rgba(255,255,255,0.8)";
      c.lineWidth = Math.max(1, scale * 0.8);
      c.shadowBlur = 0;
      c.stroke();
      c.restore();
    }

    function paintOrbit(c, w, h, data, time, freqData) {
      const { live, bands, pulse } = styleBeat(freqData);
      const col2 = getNeonColors()[1];
      const scale = Math.max(0.6, w / 1280);
      const cx = w / 2, cy = h / 2;
      const baseR = Math.min(w, h) * 0.19 * (1 + pulse * 0.30 + bands.bass * 0.18);
      const maxLen = Math.min(w, h) * 0.38;
      const N = 120;
      const rot = time * (live ? 0.5 + pulse * 0.9 : 0.12);
      const pump = 1 + pulse * 1.3 + bands.bass * 0.9;
      // Zachte halo achter de cirkel
      c.save();
      const halo = c.createRadialGradient(cx, cy, baseR * 0.4, cx, cy, baseR + maxLen);
      halo.addColorStop(0, rgba(state.barColor, 0.10 + Math.min(0.15, pulse * 0.15)));
      halo.addColorStop(1, rgba(state.barColor, 0));
      c.fillStyle = halo;
      c.beginPath();
      c.arc(cx, cy, baseR + maxLen, 0, Math.PI * 2);
      c.fill();
      c.restore();
      // Buitenste balken (zoals in die visualizer-video's)
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + rot - Math.PI / 2;
        let v;
        if (live) v = fftLogValue(freqData, i, N, freqData.length);
        else v = data[Math.floor((i / N) * (data.length - 1))] || 0;
        v = Math.min(1, Math.pow(v, 1.25) * 1.7 * pump);
        const len = Math.max(2 * scale, v * maxLen);
        const bw = (Math.PI * 2 * baseR / N) * 0.55;
        const x0 = cx + Math.cos(a) * baseR, y0 = cy + Math.sin(a) * baseR;
        const x1 = cx + Math.cos(a) * (baseR + len), y1 = cy + Math.sin(a) * (baseR + len);
        c.save();
        c.globalAlpha = 0.35 + v * 0.65;
        c.strokeStyle = i % 4 === 3 ? col2 : state.barColor;
        c.lineWidth = Math.max(1, bw * (0.7 + v * 0.6));
        c.lineCap = "round";
        c.shadowColor = c.strokeStyle;
        c.shadowBlur = (4 + v * 22 * pump) * scale;
        c.beginPath();
        c.moveTo(x0, y0);
        c.lineTo(x1, y1);
        c.stroke();
        c.restore();
      }
      // Binnenste korte balken, gespiegeld
      for (let i = 0; i < N; i += 2) {
        const a = (i / N) * Math.PI * 2 - rot * 1.4 - Math.PI / 2;
        let v;
        if (live) v = fftLogValue(freqData, (i + N / 2) % N, N, freqData.length);
        else v = data[Math.floor((i / N) * (data.length - 1))] || 0;
        v = Math.min(1, Math.pow(v, 1.2) * 1.6 * pump);
        const len = Math.max(1, v * baseR * 0.6);
        c.save();
        c.globalAlpha = 0.30 + v * 0.3;
        c.strokeStyle = state.barColor;
        c.lineWidth = Math.max(1, scale * 1.4);
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(cx + Math.cos(a) * baseR, cy + Math.sin(a) * baseR);
        c.lineTo(cx + Math.cos(a) * (baseR - len), cy + Math.sin(a) * (baseR - len));
        c.stroke();
        c.restore();
      }
      // Donkere kern + gloeiende ring
      c.save();
      c.fillStyle = "rgba(0,0,0,0.55)";
      c.beginPath();
      c.arc(cx, cy, baseR * 0.96, 0, Math.PI * 2);
      c.fill();
      c.globalAlpha = 0.95;
      c.strokeStyle = state.barColor;
      c.lineWidth = Math.max(1.5, 2.5 * scale);
      c.shadowColor = state.barColor;
      c.shadowBlur = 16 * scale * (1 + pulse * 0.8);
      c.beginPath();
      c.arc(cx, cy, baseR, 0, Math.PI * 2);
      c.stroke();
      // Pulserende kern
      const cr = Math.max(2, baseR * 0.18 * (1 + pulse * 0.9 + bands.bass * 0.5));
      const g = c.createRadialGradient(cx, cy, 0, cx, cy, cr * 2.5);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(0.4, rgba(state.barColor, 0.7));
      g.addColorStop(1, rgba(state.barColor, 0));
      c.shadowBlur = 0;
      c.fillStyle = g;
      c.beginPath();
      c.arc(cx, cy, cr * 2.5, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawParticles(w, h, data, time, played, live) {
      paintParticles(ctx, w, h, data, time, live ? state.freqData : null);
    }
    function drawOrbit(w, h, data, time, played, live) {
      paintOrbit(ctx, w, h, data, time, live ? state.freqData : null);
    }
    function drawSpiral(w, h, data, time, played, live) {
      paintSpiral(ctx, w, h, data, time, live ? state.freqData : null);
    }
    function drawScope(w, h, data, time, played, live) {
      paintScope(ctx, w, h, data, time, live ? state.freqData : null, live ? state.timeData : null);
    }
    function drawFlow(w, h, data, time, played, live) {
      paintFlow(ctx, w, h, data, time, live ? state.freqData : null, live ? state.timeData : null);
    }
    function drawParticlesCtx(c, w, h, data, time, hasLive, freqData) {
      paintParticles(c, w, h, data, time, hasLive ? freqData : null);
    }
    function drawOrbitCtx(c, w, h, data, time, hasLive, freqData) {
      paintOrbit(c, w, h, data, time, hasLive ? freqData : null);
    }
    function drawSpiralCtx(c, w, h, data, time, hasLive, freqData) {
      paintSpiral(c, w, h, data, time, hasLive ? freqData : null);
    }
    function drawScopeCtx(c, w, h, data, time, hasLive, freqData, timeData) {
      paintScope(c, w, h, data, time, hasLive ? freqData : null, hasLive ? timeData : null);
    }
    function drawFlowCtx(c, w, h, data, time, hasLive, freqData, timeData) {
      paintFlow(c, w, h, data, time, hasLive ? freqData : null, hasLive ? timeData : null);
    }

    function drawNeon(w, h, data, time, played, live) {
      drawNeonWaves(ctx, w, h, data, time, live ? state.freqData : null, live ? state.timeData : null);
    }

    function seededRand(n) {
      const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    }

    function getNeonColors() {
      const c1 = state.barColor || "#ff5fd2";
      let c2 = "#22e6ff";
      try {
        const lower = c1.toLowerCase();
        // Als primary al cyaan-achtig is, maak secondary roze en omgekeerd
        const isCyan = lower.includes("00d4") || lower.includes("22e6") || lower.includes("5cfc") || lower === "#00ffff" || lower === "#22e6ff";
        const isPink = lower.includes("ff6") || lower.includes("fc5c") || lower.includes("ff5f") || lower.includes("ff2d");
        if (isCyan) c2 = "#ff5fd2";
        else if (isPink) c2 = "#22e6ff";
        else c2 = shiftHueHex(c1, 170);
      } catch (e) { c2 = "#22e6ff"; }
      return [c1, c2];
    }

    function shiftHueHex(hex, deg) {
      let h = hex.replace("#", "");
      if (h.length === 3) h = h.split("").map((c) => c + c).join("");
      const r = parseInt(h.substring(0, 2), 16) / 255;
      const g = parseInt(h.substring(2, 4), 16) / 255;
      const b = parseInt(h.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let hh = 0, ss = 0, ll = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        ss = ll > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: hh = (g - b) / d + (g < b ? 6 : 0); break;
          case g: hh = (b - r) / d + 2; break;
          default: hh = (r - g) / d + 4; break;
        }
        hh *= 60;
      }
      hh = (hh + deg) % 360;
      if (hh < 0) hh += 360;
      return `hsl(${Math.round(hh)}, 100%, 65%)`;
    }

    // Gedeelde beat-status voor dit frame (wordt per drawNeonWaves gezet)
    const neonDyn = { bass: 0, mid: 0, high: 0, level: 0.55, pulse: 0, td: null, live: false };

    function neonBands(freqData) {
      if (!freqData || freqData.length === 0) return { bass: 0, mid: 0, high: 0, level: 0.55 };
      const n = freqData.length;
      const avg = (a, b) => {
        a = Math.max(0, a); b = Math.min(n, b);
        if (b <= a) return 0;
        let s = 0;
        for (let i = a; i < b; i++) s += freqData[i];
        return (s / (b - a)) / 255;
      };
      // fftSize 2048 -> ~21.5Hz per bin: bas ~40-300Hz, mid ~300-2.5kHz, hoog daarboven
      const bass = Math.min(1, avg(2, 14) * 2.2);
      const mid = Math.min(1, avg(14, 120) * 1.8);
      const high = Math.min(1, avg(120, 420) * 2.4);
      const level = Math.min(1, bass * 0.55 + mid * 0.3 + high * 0.15);
      return { bass, mid, high, level };
    }

    function updateBeat(bass) {
      const hist = state.beatHist;
      hist.push(bass);
      if (hist.length > 32) hist.shift();
      const avg = hist.reduce((a, b) => a + b, 0) / Math.max(1, hist.length);
      // Onset: bas duidelijk boven recent gemiddelde -> pulse omhoog
      if (bass > avg * 1.28 + 0.04 && bass > 0.22) {
        state.beatPulse = Math.min(1.2, state.beatPulse + (bass - avg) * 2.4 + 0.25);
      }
      // Snelle attack, vloeiende decay zodat het echt "pompt"
      state.beatPulse *= 0.93;
      if (state.beatPulse < 0.01) state.beatPulse = 0;
      return state.beatPulse;
    }

    function neonEnergy(freqData) {
      if (!freqData || freqData.length === 0) return 0.55;
      return neonBands(freqData).level;
    }

    function neonY(x, w, h, data, energy, t, layer) {
      const idx = Math.min(Math.floor((x / w) * data.length), data.length - 1);
      const audioBase = ((data[idx] || 0) - 0.5) * 2; // -1..1
      const nx = x / w;
      // 0 aan de randen, 1 in het midden -> lijnen komen samen aan de zijkanten zoals plaatje
      const env = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, nx))), 1.6);
      const pulse = neonDyn.pulse || 0;
      const bass = neonDyn.bass || 0;
      const pump = neonDyn.live ? 1 + pulse * 0.85 + bass * 0.45 : 1;
      const amp = h * 0.30 * (0.35 + energy * 0.9) * pump;
      // Draaggolf: paar nuldoorgangen over de breedte; bij live audio sneller + feller
      const speed = neonDyn.live ? 1.6 : 0.9;
      const ph = layer * 1.35;
      const carrier =
        Math.sin((nx - 0.12) * 10.5 + t * speed + ph) * 0.52 +
        Math.sin((nx - 0.38) * 19.0 - t * speed * 1.35 + ph * 1.4) * 0.30 +
        Math.sin(nx * 36.0 + t * speed * 2.0 + ph * 2.1) * 0.10;
      // Echte golfvorm-ripple uit de time-domain data: lijnen trillen mee met de muziek
      let ripple = 0;
      if (neonDyn.live && neonDyn.td && neonDyn.td.length > 0) {
        const ti = Math.min(neonDyn.td.length - 1, Math.floor(nx * neonDyn.td.length));
        ripple = ((neonDyn.td[ti] || 128) - 128) / 128; // -1..1
      }
      // Grote piek (links-midden) en diepe V (rechts-midden); diepte pompt op de beat
      const gauss = (c, s) => Math.exp(-Math.pow((nx - c) / s, 2));
      const beatBoost = neonDyn.live ? 1 + pulse * 1.1 + bass * 0.5 : 1;
      const peak = (gauss(0.44, 0.085) * 1.05 - gauss(0.30, 0.07) * 0.55) * beatBoost;
      const dipDepth = (layer === 1 ? 1.5 : 0.8) * beatBoost;
      const dip = gauss(0.60, 0.065) * dipDepth - gauss(0.74, 0.075) * 0.9 * beatBoost;
      const shape = audioBase * 0.45 + carrier * 0.75 + peak - dip + ripple * (neonDyn.live ? 0.9 : 0);
      return h * 0.47 + shape * amp * (0.08 + 0.92 * env);
    }

    function drawNeonStars(c, w, h, t, alphaMul) {
      const count = Math.floor((w * h) / 11000);
      c.save();
      for (let i = 0; i < count; i++) {
        const sx = seededRand(i * 2 + 1) * w;
        const sy = seededRand(i * 2 + 2) * h * 0.72;
        const rr = 0.4 + seededRand(i * 3 + 4) * (w > 1000 ? 1.5 : 0.9);
        const tw = 0.25 + 0.75 * Math.abs(Math.sin(t * (0.5 + seededRand(i + 9) * 0.9) + i * 1.7));
        c.globalAlpha = tw * 0.75 * (alphaMul || 1);
        c.fillStyle = "#ffffff";
        c.beginPath();
        c.arc(sx, sy, rr, 0, Math.PI * 2);
        c.fill();
      }
      // Paar zachte bokeh-vlekken zoals boven/onder in het plaatje
      for (let i = 0; i < 12; i++) {
        const bx = seededRand(i * 7 + 101) * w;
        const by = (seededRand(i * 7 + 103) < 0.5 ? seededRand(i + 200) * h * 0.22 : h * 0.78 + seededRand(i + 300) * h * 0.22);
        const br = (4 + seededRand(i * 5 + 107) * 14) * Math.max(0.5, w / 1280);
        const g = c.createRadialGradient(bx, by, 0, bx, by, br);
        g.addColorStop(0, "rgba(255,255,255,0.10)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        c.globalAlpha = 0.5 * (alphaMul || 1);
        c.fillStyle = g;
        c.beginPath();
        c.arc(bx, by, br, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    function neonPathPoints(w, h, data, energy, t, layer) {
      const step = Math.max(1, Math.floor(w / 720));
      const pts = [];
      for (let x = 0; x <= w; x += step) pts.push([x, neonY(x, w, h, data, energy, t, layer)]);
      return pts;
    }

    function strokeNeonTube(c, pts, color, width, glow, alpha) {
      c.save();
      c.lineJoin = "round";
      c.lineCap = "round";
      const trace = () => {
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
      };
      // Brede zachte halo
      c.globalAlpha = 0.30 * alpha;
      c.strokeStyle = color;
      c.lineWidth = width * 3.4;
      c.shadowColor = color;
      c.shadowBlur = glow * 1.6;
      trace(); c.stroke();
      // Gekleurde kern
      c.globalAlpha = 0.95 * alpha;
      c.lineWidth = width * 1.35;
      c.shadowBlur = glow;
      trace(); c.stroke();
      // Witte hete kern zoals in het plaatje
      c.globalAlpha = 0.85 * alpha;
      c.strokeStyle = "rgba(255,255,255,0.92)";
      c.lineWidth = Math.max(1, width * 0.42);
      c.shadowBlur = 0;
      trace(); c.stroke();
      c.restore();
    }

    function drawNeonWaves(c, w, h, data, time, freqData, timeData) {
      const live = !!(freqData && freqData.length > 0);
      const bands = live ? neonBands(freqData) : { bass: 0, mid: 0, high: 0, level: 0.6 };
      const pulse = live ? updateBeat(bands.bass) : (0.25 + 0.25 * Math.sin(performance.now() / 1000 * 1.4));
      neonDyn.bass = bands.bass; neonDyn.mid = bands.mid; neonDyn.high = bands.high;
      neonDyn.level = bands.level; neonDyn.pulse = pulse;
      neonDyn.td = live ? timeData : null; neonDyn.live = live;
      const t = live ? time * 1.1 + performance.now() / 1000 * 0.05 : time * 0.9 + performance.now() / 1000 * 0.12;
      const energy = bands.level;
      const [col1, col2] = getNeonColors();
      const col3 = col1;
      const scale = Math.max(0.6, w / 1280);
      const pumpW = 1 + pulse * 0.35;
      const lw = Math.max(1.4, 2.2 * scale * 0.6 + state.barWidth * 0.30) * pumpW;
      const glow = Math.min(60, (16 * scale + 10) * (1 + pulse * 0.8));
      const floorY = h * 0.70;

      // Bijna zwarte achtergrond met subtiele paars/blauwe tint in het midden
      c.fillStyle = "#030309";
      c.fillRect(0, 0, w, h);
      if (bgImageReady()) {
        c.save();
        c.globalAlpha = 0.4;
        drawCoverImage(c, state.bgImage, w, h);
        c.restore();
      }
      const bgGrad = c.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.05, w / 2, h * 0.5, Math.max(w, h) * 0.7);
      bgGrad.addColorStop(0, "rgba(40,30,80,0.35)");
      bgGrad.addColorStop(0.5, "rgba(10,20,40,0.18)");
      bgGrad.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = bgGrad;
      c.fillRect(0, 0, w, h);

      drawNeonStars(c, w, h, t, 1);

      // Dunne middenlijn
      c.save();
      c.globalAlpha = 0.16;
      c.strokeStyle = "#ffd7f2";
      c.lineWidth = Math.max(1, scale * 0.8);
      c.beginPath();
      c.moveTo(0, h * 0.47);
      c.lineTo(w, h * 0.47);
      c.stroke();
      c.restore();

      const ptsPinkBack = neonPathPoints(w, h, data, energy, t, 0);
      const ptsCyan = neonPathPoints(w, h, data, energy, t, 1);
      const ptsPinkFront = neonPathPoints(w, h, data, energy, t, 2);

      // Cyaan lint: gevulde band tussen golf en middenlijn zoals in screenshot
      c.save();
      c.globalAlpha = live ? 0.16 + Math.min(0.22, pulse * 0.22) : 0.20;
      c.fillStyle = col2;
      c.shadowColor = col2;
      c.shadowBlur = glow;
      c.beginPath();
      c.moveTo(ptsCyan[0][0], h * 0.47);
      for (const [x, y] of ptsCyan) c.lineTo(x, y);
      c.lineTo(w, h * 0.47);
      c.closePath();
      c.fill();
      c.restore();

      // Volgorde zoals plaatje: roze achter, cyaan dik ervoor, dunne roze highlight
      strokeNeonTube(c, ptsPinkBack, col1, lw * 0.95, glow, 0.9);
      strokeNeonTube(c, ptsCyan, col2, lw * 1.1, glow * 1.15, 1);
      strokeNeonTube(c, ptsPinkFront, col3, lw * 0.62, glow * 0.8, 0.95);

      // Vloer: dunne horizon + gespiegelde, onscherpe reflectie eronder
      c.save();
      c.globalAlpha = 0.35;
      const hg = c.createLinearGradient(0, 0, w, 0);
      hg.addColorStop(0, "rgba(120,220,255,0)");
      hg.addColorStop(0.5, "rgba(150,230,255,0.5)");
      hg.addColorStop(1, "rgba(120,220,255,0)");
      c.strokeStyle = hg;
      c.lineWidth = Math.max(1, scale);
      c.beginPath();
      c.moveTo(0, floorY);
      c.lineTo(w, floorY);
      c.stroke();
      c.restore();

      c.save();
      c.beginPath();
      c.rect(0, floorY, w, h - floorY);
      c.clip();
      c.globalAlpha = 0.30;
      try { c.filter = `blur(${Math.max(2, 5 * scale)}px)`; } catch (e) {}
      c.translate(0, 2 * floorY);
      c.scale(1, -0.6);
      const paint = (pts, col, wd) => {
        c.save();
        c.strokeStyle = col;
        c.lineWidth = wd;
        c.lineJoin = "round";
        c.lineCap = "round";
        c.shadowColor = col;
        c.shadowBlur = glow;
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
        c.stroke();
        c.restore();
      };
      paint(ptsPinkBack, col1, lw);
      paint(ptsCyan, col2, lw * 1.1);
      c.restore();
      try { c.filter = "none"; } catch (e) {}
      c.globalAlpha = 1;

      // Gloedvlekken op de vloer onder piek/dal
      c.save();
      const spot = (nx, rgba) => {
        const sx = nx * w;
        const sy = floorY + (h - floorY) * 0.35;
        const g = c.createRadialGradient(sx, sy, 0, sx, sy, w * 0.09);
        g.addColorStop(0, rgba);
        g.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = g;
        c.fillRect(sx - w * 0.1, floorY, w * 0.2, h - floorY);
      };
      spot(0.60, `rgba(34,230,255,${(live ? 0.16 + Math.min(0.25, pulse * 0.25) : 0.20).toFixed(3)})`);
      spot(0.44, `rgba(255,95,210,${(live ? 0.12 + Math.min(0.2, pulse * 0.2) : 0.16).toFixed(3)})`);
      c.restore();

      // Fade naar zwart onderaan
      const fade = c.createLinearGradient(0, floorY, 0, h);
      fade.addColorStop(0, "rgba(3,3,9,0)");
      fade.addColorStop(1, "rgba(3,3,9,0.78)");
      c.fillStyle = fade;
      c.fillRect(0, floorY, w, h - floorY);
    }

    function drawNeonCtx(c, w, h, data, time, hasLive, freqData, timeData) {
      const fd = hasLive ? freqData : null;
      const td = hasLive ? timeData : null;
      drawNeonWaves(c, w, h, data, time, fd, td);
    }

    let neonIdleRaf = null;
    function ensureNeonIdle() {
      if (state.waveformStyle !== "neon" || state.isPlaying || !state.waveformData) {
        if (neonIdleRaf) cancelAnimationFrame(neonIdleRaf);
        neonIdleRaf = null;
        return;
      }
      if (neonIdleRaf) return;
      const loop = () => {
        if (state.waveformStyle !== "neon" || state.isPlaying || !state.waveformData) {
          neonIdleRaf = null;
          return;
        }
        const ww = canvas.width / window.devicePixelRatio;
        const hh = canvas.height / window.devicePixelRatio;
        const tt = (state.pauseTime || 0) + performance.now() / 1000;
        ctx.clearRect(0, 0, ww, hh);
        if (state.bgMode === "gradient") {
          const grad = ctx.createLinearGradient(0, 0, 0, hh);
          grad.addColorStop(0, state.bgColor);
          grad.addColorStop(1, shiftColor(state.bgColor, 30));
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, ww, hh);
        }
        drawNeonWaves(ctx, ww, hh, state.waveformData, tt, null, null);
        neonIdleRaf = requestAnimationFrame(loop);
      };
      loop();
    }

    function roundRect(ctx, x, y, w, h, r) {
      if (h < 0) {
        y += h;
        h = Math.abs(h);
      }
      r = Math.min(r, h / 2, w / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function hexToRgb(hex) {
      let h = String(hex || "").replace("#", "");
      if (h.length === 3) h = h.split("").map((x) => x + x).join("");
      const n = parseInt(h, 16);
      if (isNaN(n) || h.length !== 6) return [124, 92, 252];
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgba(hex, a) {
      const [r, g, b] = hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    }

    function drawCoverImage(c, img, w, h) {
      const ir = img.naturalWidth / img.naturalHeight, cr = w / h;
      let dw, dh;
      if (ir > cr) { dh = h; dw = h * ir; } else { dw = w; dh = w / ir; }
      c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }

    function bgImageReady() {
      return state.bgMode === "image" && state.bgImage && state.bgImage.complete && state.bgImage.naturalWidth > 0;
    }

    function paintBackground(c, w, h) {
      if (bgImageReady()) {
        drawCoverImage(c, state.bgImage, w, h);
        c.fillStyle = "rgba(0,0,0,0.55)";
        c.fillRect(0, 0, w, h);
        return;
      }
      if (state.bgMode === "gradient") {
        const grad = c.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, state.bgColor);
        grad.addColorStop(1, shiftColor(state.bgColor, 30));
        c.fillStyle = grad;
      } else {
        c.fillStyle = state.bgColor;
      }
      c.fillRect(0, 0, w, h);
    }

    function shiftColor(hex, amount) {
      hex = hex.replace("#", "");
      let r = parseInt(hex.substring(0, 2), 16);
      let g = parseInt(hex.substring(2, 4), 16);
      let b = parseInt(hex.substring(4, 6), 16);
      r = Math.min(255, r + amount);
      g = Math.min(255, g + amount);
      b = Math.min(255, b + amount);
      return `rgb(${r},${g},${b})`;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    // Playback
    const playBtn = $("#play-btn");

    playBtn.addEventListener("click", () => {
      if (state.isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

    function currentPosition() {
      if (!state.audioBuffer) return 0;
      if (state.isPlaying && state.audioContext) {
        return Math.min(
          state.audioBuffer.duration,
          (state.audioContext.currentTime - state.startTime) * state.playbackRate
        );
      }
      return state.pauseTime || 0;
    }

    async function startPlayback() {
      if (!state.audioBuffer || !state.audioContext) return;

      if (state.audioContext.state === "suspended") {
        state.audioContext.resume().catch(e => console.error("[play] resume failed:", e));
      }

      state.sourceNode = state.audioContext.createBufferSource();
      state.sourceNode.buffer = state.audioBuffer;
      state.sourceNode.playbackRate.value = state.playbackRate;
      state.sourceNode.connect(state.analyserNode);
      state.analyserNode.connect(state.audioContext.destination);
      state.sourceNode.start(0, state.pauseTime);
      state.startTime = state.audioContext.currentTime - state.pauseTime / state.playbackRate;
      state.isPlaying = true;
      playBtn.textContent = "⏸";

      state.sourceNode.onended = () => {
        if (state.isPlaying) {
          state.isPlaying = false;
          state.pauseTime = 0;
          playBtn.textContent = "▶";
          ensureNeonIdle();
        }
      };

      animatePlayback();
    }

    function stopPlayback() {
      if (state.sourceNode) {
        state.sourceNode.onended = null;
        try { state.sourceNode.stop(); } catch (e) {}
      }
      state.pauseTime = currentPosition();
      state.isPlaying = false;
      playBtn.textContent = "▶";
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      ensureNeonIdle();
    }

    function seekTo(t) {
      if (!state.audioBuffer) return;
      t = Math.max(0, Math.min(state.audioBuffer.duration, t));
      const wasPlaying = state.isPlaying;
      if (wasPlaying) stopPlayback();
      state.pauseTime = t;
      updateProgressUI(t);
      drawPreviewFrame();
      if (wasPlaying) startPlayback();
    }

    function setRate(r) {
      state.playbackRate = r;
      $("#speed-btn").textContent = String(r).replace(".", ",") + "×";
      if (state.isPlaying) {
        const pos = currentPosition();
        stopPlayback();
        state.pauseTime = pos;
        startPlayback();
      }
    }

    function updateProgressUI(t) {
      const dur = state.audioBuffer ? state.audioBuffer.duration : 0;
      $("#time-current").textContent = formatTime(t);
      $("#progress-fill").style.width = (dur > 0 ? (t / dur) * 100 : 0) + "%";
    }

    function animatePlayback() {
      if (!state.isPlaying) return;

      const elapsed = currentPosition();
      const dur = state.audioBuffer.duration;
      const pct = Math.min(elapsed / dur, 1);

      updateProgressUI(elapsed);

      // Read live frequency data from analyser
      if (state.analyserNode) {
        state.analyserNode.getByteFrequencyData(state.freqData);
        state.analyserNode.getByteTimeDomainData(state.timeData);
      }

      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      drawWaveformStyle(w, h, elapsed);

      if (pct < 1) {
        state.animFrame = requestAnimationFrame(animatePlayback);
      }
    }

    function drawPreviewFrame() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      drawWaveformStyle(w, h, currentPosition());
      ensureNeonIdle();
    }

    // Progress bar click
    $("#progress-bar").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      seekTo(pct * (state.audioBuffer?.duration || 0));
    });

    // Skippen + snelheid
    $("#skip-back").addEventListener("click", () => seekTo(currentPosition() - 10));
    $("#skip-fwd").addEventListener("click", () => seekTo(currentPosition() + 10));
    $("#speed-btn").addEventListener("click", () => {
      const i = SPEEDS.indexOf(state.playbackRate);
      setRate(SPEEDS[(i + 1) % SPEEDS.length]);
    });

    // Waveform style selection
    $$(".waveform-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        $$(".waveform-option").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        state.waveformStyle = btn.dataset.style;
        if (state.waveformData) drawPreviewFrame();
        saveSettings();
      });
    });

    // Color swatches
    $$("#bg-colors .color-swatch").forEach((s) => {
      s.addEventListener("click", () => {
        $$("#bg-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
        s.classList.add("selected");
        state.bgColor = s.dataset.color;
        $("#bg-custom").value = s.dataset.color;
        drawIdle();
        if (state.waveformData) drawPreviewFrame();
        saveSettings();
      });
    });

    $$("#bar-colors .color-swatch").forEach((s) => {
      s.addEventListener("click", () => {
        $$("#bar-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
        s.classList.add("selected");
        state.barColor = s.dataset.color;
        $("#bar-custom").value = s.dataset.color;
        if (state.waveformData) drawPreviewFrame();
        saveSettings();
      });
    });

    // Eigen kleur via color-picker
    $("#bg-custom").addEventListener("input", (e) => {
      $$("#bg-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
      state.bgColor = e.target.value;
      drawIdle();
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    $("#bar-custom").addEventListener("input", (e) => {
      $$("#bar-colors .color-swatch").forEach((x) => x.classList.remove("selected"));
      state.barColor = e.target.value;
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    // Achtergrondmodus + afbeelding
    $("#bg-mode").addEventListener("change", (e) => {
      state.bgMode = e.target.value;
      $("#bg-image-row").style.display = state.bgMode === "image" ? "flex" : "none";
      drawIdle();
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    $("#bg-image-btn").addEventListener("click", () => $("#bg-image-input").click());

    $("#bg-image-input").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        state.bgImage = img;
        state.bgImageName = file.name;
        $("#bg-image-btn").textContent = file.name;
        drawIdle();
        if (state.waveformData) drawPreviewFrame();
      };
      img.src = url;
    });

    // Instellingen onthouden
    function saveSettings() {
      try {
        localStorage.setItem("wavy.settings", JSON.stringify({
          waveformStyle: state.waveformStyle,
          bgColor: state.bgColor,
          barColor: state.barColor,
          barWidth: state.barWidth,
          barGap: state.barGap,
          smoothing: state.smoothing,
          resolution: state.resolution,
          exportFormat: state.exportFormat,
          bgMode: state.bgMode === "image" ? "solid" : state.bgMode,
        }));
      } catch (e) {}
    }

    function loadSettings() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem("wavy.settings") || "null"); } catch (e) {}
      if (!s) return;
      if (s.waveformStyle) {
        state.waveformStyle = s.waveformStyle;
        $$(".waveform-option").forEach((b) => b.classList.toggle("selected", b.dataset.style === s.waveformStyle));
      }
      if (s.bgColor) {
        state.bgColor = s.bgColor;
        $("#bg-custom").value = s.bgColor;
        $$("#bg-colors .color-swatch").forEach((x) => x.classList.toggle("selected", x.dataset.color === s.bgColor));
      }
      if (s.barColor) {
        state.barColor = s.barColor;
        $("#bar-custom").value = s.barColor;
        $$("#bar-colors .color-swatch").forEach((x) => x.classList.toggle("selected", x.dataset.color === s.barColor));
      }
      if (s.barWidth) { state.barWidth = s.barWidth; $("#bar-width").value = s.barWidth; $("#bar-width-val").textContent = s.barWidth; }
      if (s.barGap) { state.barGap = s.barGap; $("#bar-gap").value = s.barGap; $("#bar-gap-val").textContent = s.barGap; }
      if (s.smoothing != null) {
        state.smoothing = s.smoothing;
        $("#smoothing").value = Math.round(s.smoothing * 100);
        $("#smoothing-val").textContent = Number(s.smoothing).toFixed(2);
      }
      if (s.resolution) { state.resolution = s.resolution; $("#resolution").value = String(s.resolution); }
      if (s.exportFormat) { state.exportFormat = s.exportFormat; $("#export-format").value = s.exportFormat; }
      if (s.bgMode) {
        state.bgMode = s.bgMode;
        $("#bg-mode").value = s.bgMode;
        $("#bg-image-row").style.display = s.bgMode === "image" ? "flex" : "none";
      }
    }

    // Sliders
    $("#bar-width").addEventListener("input", (e) => {
      state.barWidth = +e.target.value;
      $("#bar-width-val").textContent = e.target.value;
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    $("#bar-gap").addEventListener("input", (e) => {
      state.barGap = +e.target.value;
      $("#bar-gap-val").textContent = e.target.value;
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    $("#smoothing").addEventListener("input", (e) => {
      state.smoothing = e.target.value / 100;
      $("#smoothing-val").textContent = (e.target.value / 100).toFixed(2);
      if (state.analyserNode) state.analyserNode.smoothingTimeConstant = state.smoothing;
      if (state.waveformData) drawPreviewFrame();
      saveSettings();
    });

    $("#resolution").addEventListener("change", (e) => {
      state.resolution = +e.target.value;
      saveSettings();
    });

    $("#export-format").addEventListener("change", (e) => {
      state.exportFormat = e.target.value;
      saveSettings();
    });

    // Export to video using canvas captureStream + MediaRecorder
    $("#export-btn").addEventListener("click", async () => {
      if (!state.audioBuffer) return;

      const formatConfig = {
        webm: {
          mimeTypes: ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"],
          ext: "webm",
          extensions: ["webm"],
        },
        "webm-vp8": {
          mimeTypes: ["video/webm;codecs=vp8", "video/webm"],
          ext: "webm",
          extensions: ["webm"],
        },
        mp4: {
          mimeTypes: ["video/mp4;codecs=h264", "video/mp4"],
          ext: "mp4",
          extensions: ["mp4"],
        },
      };
      const fmt = formatConfig[state.exportFormat] || formatConfig.webm;

      const savePath = await window.electronAPI.saveVideo(
        "waveform_" + state.waveformStyle + "." + fmt.ext,
        fmt.extensions
      );
      if (!savePath) return;

      if (state.isPlaying) stopPlayback();

      const overlay = $("#progress-overlay");
      overlay.classList.add("active");
      $("#export-btn").disabled = true;

      const resMap = {
        720: [1280, 720],
        1080: [1920, 1080],
        1440: [2560, 1440],
        2160: [3840, 2160],
      };
      const [exportW, exportH] = resMap[state.resolution] || [1920, 1080];

      const offscreen = document.createElement("canvas");
      offscreen.width = exportW;
      offscreen.height = exportH;
      const offCtx = offscreen.getContext("2d");

      const stream = offscreen.captureStream(60);
      let mimeType = fmt.mimeTypes.find(t => MediaRecorder.isTypeSupported(t));
      if (!mimeType) {
        mimeType = formatConfig.webm.mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || "";
      }
      const recorderOpts = { videoBitsPerSecond: 8000000 };
      if (mimeType) recorderOpts.mimeType = mimeType;
      const recorder = new MediaRecorder(stream, recorderOpts);

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createBufferSource();
      source.buffer = state.audioBuffer;
      const exportAnalyser = audioCtx.createAnalyser();
      exportAnalyser.fftSize = 2048;
      exportAnalyser.smoothingTimeConstant = state.smoothing;
      const exportFreqData = new Uint8Array(exportAnalyser.frequencyBinCount);
      const exportTimeData = new Uint8Array(exportAnalyser.frequencyBinCount);
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(exportAnalyser);
